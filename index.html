ptions inchangée, le\n   signal porte sur le libellé et le message. */\n.mtx-chip-group[aria-invalid=\"true\"] .mtx-chip,\n.mtx-choice-group[aria-invalid=\"true\"] .mtx-choice {\n  border-color: var(--mtx-border-color-error);\n}\n.mtx-checkbox[aria-invalid=\"true\"] .mtx-checkbox__box {\n  border-color: var(--mtx-border-color-error);\n  background: var(--mtx-surface-color-error);\n}\n\n/* ============================================================\n   COMPOSANT — Case à cocher\n   Tailles : m (24) · s (22) · États : default · checked\n   ============================================================ */\n\n.mtx-checkbox {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-12);\n  padding: 0;\n  border: 0;\n  background: none;\n  text-align: left;\n}\n.mtx-checkbox__box {\n  --mtx-checkbox-size: var(--mtx-icon-size-s); /* 16px */\n  width: var(--mtx-checkbox-size);\n  height: var(--mtx-checkbox-size);\n  flex: 0 0 auto;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  border: 1.5px solid var(--mtx-text-color-primary);\n  border-radius: var(--mtx-radius-xs);\n  background: var(--mtx-surface-color-light);\n  color: var(--mtx-text-color-brand);\n  transition: var(--mtx-transition-color);\n}\n.mtx-checkbox__box svg { visibility: hidden; }\n.mtx-checkbox[aria-pressed=\"true\"] .mtx-checkbox__box {\n  border-color: var(--mtx-border-color-brand);\n  background: var(--mtx-surface-color-brand-light);\n}\n.mtx-checkbox[aria-pressed=\"true\"] .mtx-checkbox__box svg { visibility: visible; }\n\n.mtx-checkbox__label {\n  font: var(--mtx-body-font-14-bold);\n  color: var(--mtx-text-color-primary);\n}\n\n/* Variante consentement : case pleine, libellé courant */\n.mtx-checkbox--solid .mtx-checkbox__box {\n  margin-top: 0;\n  border-color: var(--mtx-gris-500);\n  color: var(--mtx-text-color-invert);\n}\n.mtx-checkbox--solid[aria-pressed=\"true\"] .mtx-checkbox__box {\n  background: var(--mtx-surface-color-brand);\n  border-color: var(--mtx-border-color-brand);\n}\n.mtx-checkbox--solid .mtx-checkbox__label { font: var(--mtx-body-font-14-regular); }\n\n/* ============================================================\n   COMPOSANT — Carte de contenu\n   Variantes : --elevated (parcours) · --surface (bloc interne)\n   ============================================================ */\n\n.mtx-card {\n  position: relative;\n  background: var(--mtx-surface-color-light);\n  border-radius: var(--mtx-radius-xl);\n  padding: var(--mtx-space-20);\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-20);\n}\n@media (min-width: 1090px) {\n  .mtx-card { padding: var(--mtx-space-40); }\n}\n/* Ombre XL du DS, première couche uniquement, opacité réduite de 30 % */\n.mtx-card--elevated {\n  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.056);\n}\n\n.mtx-card--surface {\n  background: var(--mtx-surface-color-brand-alt-light);\n  border-radius: var(--mtx-radius-l);\n  padding: var(--mtx-space-24);\n  box-shadow: none;\n  gap: var(--mtx-space-24);\n}\n\n.mtx-card__info {\n  position: absolute;\n  top: var(--mtx-space-20);\n  right: var(--mtx-space-20);\n  width: 28px;\n  height: 28px;\n  padding: 0;\n  border: 0;\n  border-radius: var(--mtx-radius-full);\n  background: transparent;\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-card__info:hover { opacity: var(--mtx-opacity-strong); }\n}\n\n.mtx-card__title {\n  padding-bottom: var(--mtx-space-12);\n  font: var(--mtx-heading-font-20-bold);\n  color: var(--mtx-text-color-brand);\n  text-wrap: pretty;\n}\n@media (min-width: 1090px) {\n  .mtx-card__title { font: var(--mtx-heading-font-26-bold); }\n}\n\n.mtx-card__actions {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--mtx-space-16);\n  padding-top: var(--mtx-space-20);\n  min-height: 48px;\n}\n.mtx-card__actions > .mtx-card__actions-end { margin-left: auto; }\n\n/* ============================================================\n   COMPOSANT — Message global (alerte de formulaire)\n   Variantes : --error (défaut) · --info\n   Usage : erreurs non liées à un champ (réseau, serveur,\n   session expirée). Le message champ par champ reste\n   `.mtx-field__error`.\n   ============================================================ */\n\n.mtx-alert {\n  display: flex;\n  align-items: flex-start;\n  gap: var(--mtx-space-12);\n  padding: var(--mtx-space-16) var(--mtx-space-20);\n  border: var(--mtx-border-width-s) solid var(--mtx-border-color-error);\n  border-radius: var(--mtx-radius-l);\n  background: var(--mtx-surface-color-error);\n  color: var(--mtx-text-color-error-on-surface);\n}\n.mtx-alert__body {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-4);\n  min-width: 0;\n}\n.mtx-alert__title { font: var(--mtx-heading-font-16-bold); }\n.mtx-alert__text {\n  font: var(--mtx-body-font-14-regular);\n  color: var(--mtx-text-color-primary);\n  text-wrap: pretty;\n}\n.mtx-alert__actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--mtx-space-8);\n  margin-top: var(--mtx-space-4);\n}\n\n.mtx-alert--info {\n  border-color: var(--mtx-border-color-info);\n  background: var(--mtx-surface-color-info);\n  color: var(--mtx-text-color-info-on-surface);\n}\n\n/* ============================================================\n   COMPOSANT — Bandeau produit (contour marque alt)\n   ============================================================ */\n\n.mtx-banner {\n  display: flex;\n  flex-direction: column;\n  border: var(--mtx-border-width-s) solid var(--mtx-marron-200);\n  border-radius: var(--mtx-radius-m);\n  color: var(--mtx-text-color-brand-alt);\n  overflow: hidden;\n}\n.mtx-banner__main {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-12);\n  min-width: 0;\n}\n.mtx-banner__main > [data-icon] { flex: 0 0 auto; }\n.mtx-banner__body {\n  flex: 1 1 auto;\n  min-width: 0;\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-2);\n}\n.mtx-banner__title { font: var(--mtx-body-font-14-bold); }\n.mtx-banner__text { font: var(--mtx-body-font-14-regular); }\n.mtx-banner__meta { font: var(--mtx-body-font-14-bold); }\n\n@media (max-width: 1089px) {\n  .mtx-banner { padding: var(--mtx-space-12) 0; }\n  .mtx-banner__main { padding: 0 var(--mtx-space-16); }\n  /* Filet pointillé pleine largeur + mention centrée (maquette mobile) */\n  .mtx-banner__meta {\n    margin-top: var(--mtx-space-8);\n    padding-top: var(--mtx-space-8);\n    border-top: var(--mtx-border-width-s) dashed var(--mtx-marron-200);\n    text-align: center;\n  }\n}\n\n@media (min-width: 1090px) {\n  .mtx-banner {\n    flex-direction: row;\n    align-items: center;\n    justify-content: space-between;\n    flex-wrap: wrap;\n    gap: var(--mtx-space-4) var(--mtx-space-16);\n    padding: var(--mtx-space-12) var(--mtx-space-20);\n  }\n  .mtx-banner__main { gap: var(--mtx-space-8); }\n  .mtx-banner__body {\n    flex-direction: row;\n    align-items: center;\n    gap: var(--mtx-space-8);\n    flex-wrap: wrap;\n  }\n  .mtx-banner__title,\n  .mtx-banner__meta { white-space: nowrap; }\n}\n\n/* ============================================================\n   COMPOSANT — Encart d'information (callout)\n   Variantes : --info (défaut) · --success · --warning\n   ============================================================ */\n\n.mtx-callout {\n  border-radius: var(--mtx-radius-l);\n  padding: var(--mtx-space-24);\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-8);\n  background: var(--mtx-surface-color-info);\n}\n.mtx-callout__head {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-8);\n  color: var(--mtx-text-color-info-on-surface);\n}\n.mtx-callout__title { font: var(--mtx-heading-font-16-bold); }\n.mtx-callout__text {\n  font: var(--mtx-body-font-14-regular);\n  color: var(--mtx-text-color-primary);\n  text-wrap: pretty;\n}\n.mtx-callout__text b { font-weight: var(--mtx-font-weight-bold); }\n\n.mtx-callout--success { background: var(--mtx-surface-color-success); }\n.mtx-callout--success .mtx-callout__head { color: var(--mtx-text-color-success-on-surface); }\n\n.mtx-callout--warning { background: var(--mtx-surface-color-warning); }\n.mtx-callout--warning .mtx-callout__head { color: var(--mtx-text-color-warning-on-surface); }\n\n/* Pastille de statut inline (ex. « Dernière étape ») */\n.mtx-status-pill {\n  align-self: flex-start;\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-8);\n  padding: var(--mtx-space-8) var(--mtx-space-16);\n  border-radius: var(--mtx-radius-s);\n  background: var(--mtx-surface-color-success);\n  color: var(--mtx-text-color-success-on-surface);\n  font: var(--mtx-body-font-14-bold);\n}\n@media (max-width: 1089px) {\n  .mtx-status-pill { align-self: stretch; }\n}\n\n/* ============================================================\n   COMPOSANT — Modale (élément natif <dialog>)\n   ============================================================ */\n\n.mtx-modal {\n  width: 100%;\n  max-width: 612px;\n  max-height: 90vh;\n  padding: var(--mtx-space-40);\n  border: 0;\n  border-radius: var(--mtx-radius-xl);\n  background: var(--mtx-surface-color-light);\n  box-shadow: var(--mtx-shadow-xl);\n  color: var(--mtx-text-color-primary);\n  overflow: auto;\n}\n.mtx-modal::backdrop { background: rgba(48, 46, 45, 0.45); }\n.mtx-modal[open] {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-24);\n  animation: mtx-modal-in var(--mtx-duration-default) var(--mtx-ease-out) both;\n}\n.mtx-modal__close {\n  position: absolute;\n  top: var(--mtx-space-24);\n  right: var(--mtx-space-24);\n  width: 28px;\n  height: 28px;\n  padding: 0;\n  border: 0;\n  background: none;\n  color: var(--mtx-icon-color-dark);\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-modal__close:hover { color: var(--mtx-text-color-brand); }\n}\n\n.mtx-modal__title {\n  padding-right: var(--mtx-space-40);\n  font: var(--mtx-heading-font-20-bold);\n  color: var(--mtx-text-color-primary);\n  text-wrap: pretty;\n}\n@media (min-width: 768px) {\n  .mtx-modal__title { font: var(--mtx-heading-font-24-bold); }\n}\n.mtx-modal__text {\n  font: var(--mtx-body-font-16-regular);\n  text-wrap: pretty;\n}\n.mtx-modal__body {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-8);\n}\n.mtx-modal__footer {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--mtx-space-12);\n}\n.mtx-modal__footer--center { justify-content: center; }\n\n/* Formule de calcul (suite d'opérandes empilés) */\n.mtx-formula {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: var(--mtx-space-8);\n}\n.mtx-formula__term {\n  display: block;\n  padding: var(--mtx-space-12) var(--mtx-space-28);\n  border: var(--mtx-border-width-s) solid var(--mtx-border-color-light);\n  border-radius: var(--mtx-radius-s);\n  font: var(--mtx-heading-font-16-regular);\n  color: var(--mtx-text-color-primary);\n  text-align: center;\n}\n.mtx-formula__term--total {\n  font: var(--mtx-heading-font-16-bold);\n  color: var(--mtx-text-color-brand);\n}\n.mtx-formula__operator {\n  font: var(--mtx-heading-font-16-bold);\n  color: var(--mtx-text-color-primary);\n}\n\n/* Mobile : la modale devient une bottom sheet qui monte depuis le bas. */\n@media (max-width: 767px) {\n  .mtx-modal {\n    width: 100%;\n    max-width: none;\n    max-height: 88vh;\n    margin: auto 0 0;\n    padding: var(--mtx-space-24) var(--mtx-space-20)\n             calc(var(--mtx-space-24) + env(safe-area-inset-bottom, 0px));\n    border-radius: var(--mtx-radius-xl) var(--mtx-radius-xl) 0 0;\n  }\n  .mtx-modal[open] {\n    gap: var(--mtx-space-20);\n    animation: mtx-sheet-in 320ms var(--mtx-ease-out) both;\n  }\n  .mtx-modal__close {\n    top: var(--mtx-space-20);\n    right: var(--mtx-space-20);\n  }\n  .mtx-modal__title { padding-right: var(--mtx-space-32); }\n}\n@keyframes mtx-sheet-in {\n  from { opacity: 0; transform: translateY(100%); }\n  to { opacity: 1; transform: none; }\n}\n\n@keyframes mtx-modal-in {\n  from { opacity: 0; transform: translateY(-10px) scale(0.99); }\n  to { opacity: 1; transform: none; }\n}\n\n/* ============================================================\n   COMPOSANT — Stepper vertical (desktop ≥ 1090px)\n   États d'étape : upcoming · current · done\n   ============================================================ */\n\n.mtx-stepper {\n  position: sticky;\n  top: var(--mtx-space-40);\n  flex: 0 0 396px;\n  display: grid;\n  grid-template-columns: 8px minmax(0, 1fr);\n  column-gap: 11px;\n  align-content: start;\n}\n@media (max-width: 1089px) {\n  .mtx-stepper { display: none; }\n}\n\n.mtx-stepper__rail,\n.mtx-stepper__rail-fill {\n  position: absolute;\n  left: 0;\n  top: 0;\n  width: 8px;\n  border-radius: var(--mtx-radius-full);\n}\n.mtx-stepper__rail { background: var(--mtx-marron-100); }\n.mtx-stepper__rail-fill {\n  background: var(--mtx-surface-color-brand-alt);\n  transition: height 620ms var(--mtx-ease-in-out);\n}\n\n.mtx-stepper__list,\n.mtx-stepper__item { display: contents; }\n\n.mtx-stepper__gutter {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n}\n.mtx-stepper__gutter-line { width: 8px; flex: 1 1 auto; min-height: 12px; }\n\n/* Dernière étape : le rail s'arrête au niveau de la puce */\n.mtx-stepper__item[data-last=\"true\"] .mtx-stepper__gutter { justify-content: flex-start; }\n.mtx-stepper__item[data-last=\"true\"] [data-role=\"line-top\"] { flex: 0 0 auto; height: 11px; }\n.mtx-stepper__item[data-last=\"true\"] [data-role=\"line-bottom\"] { flex: 0 0 auto; height: 6px; }\n\n.mtx-stepper__dot {\n  width: 12px;\n  height: 12px;\n  margin-block: -4px;\n  flex: 0 0 auto;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  border-radius: var(--mtx-radius-full);\n  background: var(--mtx-surface-color-light);\n  color: var(--mtx-text-color-brand-alt);\n  box-shadow: inset 0 0 0 1.5px var(--mtx-marron-200);\n  z-index: 1;\n  transition: box-shadow 480ms var(--mtx-ease-in-out), color 480ms var(--mtx-ease-in-out);\n}\n.mtx-stepper__item[data-state=\"current\"] .mtx-stepper__dot,\n.mtx-stepper__item[data-state=\"done\"] .mtx-stepper__dot {\n  box-shadow: inset 0 0 0 1.5px var(--mtx-color-brand-alt);\n}\n.mtx-stepper__item[data-state=\"done\"] .mtx-stepper__dot {\n  width: 20px;\n  height: 20px;\n  margin-block: -8px;\n}\n.mtx-stepper__dot svg { visibility: hidden; }\n.mtx-stepper__item[data-state=\"done\"] .mtx-stepper__dot svg { visibility: visible; }\n\n.mtx-stepper__card {\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  min-height: 60px;\n  padding: 7px 17px;\n  margin-bottom: var(--mtx-space-20);\n  border-radius: var(--mtx-radius-l);\n  background: transparent;\n  transition: background 480ms var(--mtx-ease-in-out);\n}\n.mtx-stepper__item[data-state=\"current\"] .mtx-stepper__card {\n  background: var(--mtx-surface-color-light);\n}\n.mtx-stepper__badge {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-4);\n}\n/* Trophée de la dernière étape : icône inline, en gris comme le libellé */\n.mtx-stepper__badge [data-icon=\"trophy\"] {\n  display: flex;\n  flex: 0 0 auto;\n  color: var(--mtx-text-color-tertiary);\n}\n.mtx-stepper__index {\n  font: var(--mtx-body-font-12-regular);\n  color: var(--mtx-text-color-tertiary);\n  white-space: nowrap;\n  transition: color 480ms var(--mtx-ease-in-out);\n}\n.mtx-stepper__name {\n  font: var(--mtx-body-font-16-regular);\n  color: var(--mtx-text-color-tertiary);\n  transition: color 480ms var(--mtx-ease-in-out), font-variation-settings 480ms var(--mtx-ease-in-out);\n}\n.mtx-stepper__item[data-state=\"done\"] .mtx-stepper__index,\n.mtx-stepper__item[data-state=\"current\"] .mtx-stepper__index { color: var(--mtx-text-color-primary); }\n.mtx-stepper__item[data-state=\"done\"] .mtx-stepper__name,\n.mtx-stepper__item[data-state=\"current\"] .mtx-stepper__name { color: var(--mtx-text-color-brand-alt); }\n.mtx-stepper__item[data-state=\"done\"] .mtx-stepper__name { font-weight: var(--mtx-font-weight-semibold); }\n.mtx-stepper__item[data-state=\"current\"] .mtx-stepper__name { font-weight: var(--mtx-font-weight-bold); }\n\n/* ============================================================\n   COMPOSANT — Barre de progression\n   Tailles : --s (4px, navigation) · défaut (8px, chargement)\n   ============================================================ */\n\n.mtx-progress {\n  height: 8px;\n  border-radius: var(--mtx-radius-full);\n  background: var(--mtx-border-color-light);\n  overflow: hidden;\n}\n.mtx-progress--s { height: var(--mtx-border-width-xl); }\n\n.mtx-progress__bar {\n  width: 0;\n  height: 100%;\n  border-radius: var(--mtx-radius-full);\n  background: var(--mtx-surface-color-brand-alt);\n  transition: width var(--mtx-duration-default) var(--mtx-ease-in-out);\n}\n.mtx-progress--brand .mtx-progress__bar { background: var(--mtx-surface-color-brand); }\n\n.mtx-progress-head {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: var(--mtx-space-16);\n}\n.mtx-progress-head__label { font: var(--mtx-body-font-16-regular); color: var(--mtx-text-color-primary); }\n.mtx-progress-head__value {\n  font: var(--mtx-body-font-16-bold);\n  color: var(--mtx-text-color-primary);\n  font-variant-numeric: tabular-nums;\n}\n\n/* ============================================================\n   COMPOSANT — Liste de tâches en cours (écran d'étude)\n   États : pending · active · done\n   ============================================================ */\n\n.mtx-task-list {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-12);\n}\n.mtx-task {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-16);\n  min-height: 72px;\n  padding: 14px var(--mtx-space-20);\n  border-radius: var(--mtx-radius-l);\n  background: var(--mtx-surface-color-medium);\n  transition: background 480ms var(--mtx-ease-in-out);\n}\n.mtx-task__badge {\n  width: 38px;\n  height: 38px;\n  flex: 0 0 auto;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  border-radius: var(--mtx-radius-full);\n  background: var(--mtx-gris-100);\n  color: var(--mtx-text-color-tertiary);\n  font: var(--mtx-body-font-16-regular);\n  transition: var(--mtx-transition-color);\n}\n.mtx-task__label {\n  font: var(--mtx-heading-font-18-regular);\n  color: var(--mtx-text-color-tertiary);\n  text-wrap: pretty;\n  transition: color 480ms var(--mtx-ease-in-out);\n}\n\n.mtx-task[data-state=\"done\"] { background: var(--mtx-surface-color-success); }\n.mtx-task[data-state=\"done\"] .mtx-task__badge {\n  background: var(--mtx-surface-color-light);\n  color: var(--mtx-icon-color-success-on-surface);\n}\n.mtx-task[data-state=\"done\"] .mtx-task__label {\n  color: var(--mtx-text-color-success-on-surface);\n  font-weight: var(--mtx-font-weight-bold);\n}\n\n.mtx-task[data-state=\"active\"] { background: var(--mtx-surface-color-brand-light); }\n.mtx-task[data-state=\"active\"] .mtx-task__badge {\n  background: var(--mtx-surface-color-brand-alt);\n  color: var(--mtx-text-color-invert);\n}\n.mtx-task[data-state=\"active\"] .mtx-task__label {\n  color: var(--mtx-text-color-brand-alt);\n  font-weight: var(--mtx-font-weight-bold);\n}\n\n/* Mobile : libellés en 14 px, blocs moins hauts (maquette) */\n@media (max-width: 1089px) {\n  .mtx-task {\n    min-height: 56px;\n    gap: var(--mtx-space-12);\n    padding: var(--mtx-space-12) var(--mtx-space-16);\n  }\n  .mtx-task__label { font: var(--mtx-body-font-14-regular); }\n  .mtx-task[data-state=\"done\"] .mtx-task__label,\n  .mtx-task[data-state=\"active\"] .mtx-task__label { font-weight: var(--mtx-font-weight-bold); }\n  .mtx-task__badge { width: 32px; height: 32px; }\n}\n\n.mtx-task__spinner {\n  width: 18px;\n  height: 18px;\n  border-radius: var(--mtx-radius-full);\n  border: 2.4px solid rgba(255, 255, 255, 0.35);\n  border-top-color: var(--mtx-blanc);\n  animation: mtx-spin 1400ms linear infinite;\n}\n@keyframes mtx-spin { to { transform: rotate(360deg); } }\n\n/* ============================================================\n   COMPOSANT — Panneau de lignes répétables (revenus, charges)\n   ============================================================ */\n\n.mtx-repeat {\n  width: 100%;\n  align-self: stretch;\n  background: var(--mtx-surface-color-medium);\n  border-radius: var(--mtx-radius-l);\n  padding: var(--mtx-space-16);\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-12);\n}\n@media (min-width: 1090px) {\n  .mtx-repeat { padding: var(--mtx-space-20) var(--mtx-space-24); }\n}\n\n.mtx-repeat__head { display: none; }\n.mtx-repeat__col-title {\n  font: var(--mtx-body-font-14-bold);\n  color: var(--mtx-text-color-primary);\n}\n\n.mtx-repeat__row {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-8);\n}\n/* L'entrée (data-enter) et la sortie sont animées en JS — hauteur, gap et\n   padding sont dépliés/repliés progressivement (voir controls.js) : les\n   lignes déjà présentes ne bougent pas au remount. */\n\n/* Cellule d'une ligne : libellé + contrôle (le libellé n'est\n   visible que sur mobile, l'en-tête de colonnes le remplace\n   sur desktop). */\n.mtx-repeat__cell {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-4);\n  min-width: 0;\n}\n.mtx-repeat__row-label {\n  font: var(--mtx-body-font-14-bold);\n  color: var(--mtx-text-color-primary);\n}\n\n/* Mobile : lignes séparées par un filet pointillé, bouton de\n   suppression explicite et pleine largeur (maquettes mobiles). */\n@media (max-width: 1089px) {\n  .mtx-repeat { gap: var(--mtx-space-16); }\n  .mtx-repeat__row + .mtx-repeat__row {\n    border-top: var(--mtx-border-width-s) dashed var(--mtx-border-color-light);\n    padding-top: var(--mtx-space-16);\n  }\n  .mtx-repeat__add > .mtx-button { width: 100%; }\n}\n@media (min-width: 1090px) {\n  .mtx-repeat__row-label,\n  .mtx-repeat__remove-label { display: none; }\n}\n\n@media (min-width: 1090px) {\n  .mtx-repeat__head,\n  .mtx-repeat__row {\n    display: grid;\n    column-gap: var(--mtx-space-16);\n    align-items: center;\n  }\n  .mtx-repeat--income .mtx-repeat__head,\n  .mtx-repeat--income .mtx-repeat__row {\n    grid-template-columns: minmax(0, 1fr) minmax(0, 200px) 28px;\n  }\n  .mtx-repeat--charges .mtx-repeat__head,\n  .mtx-repeat--charges .mtx-repeat__row {\n    grid-template-columns: minmax(0, 1fr) minmax(0, 170px) minmax(0, 170px) 28px;\n  }\n  .mtx-repeat--charges .mtx-repeat__head { align-items: end; }\n}\n\n.mtx-repeat__remove {\n  width: 28px;\n  height: 40px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 0;\n  border: 0;\n  background: none;\n  color: var(--mtx-icon-color-error);\n  transition: opacity var(--mtx-duration-default) var(--mtx-ease-in-out);\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-repeat__remove:hover { opacity: var(--mtx-opacity-strong); }\n}\n\n/* Mobile : lien de suppression explicite, centré dans un bouton\n   contour pleine largeur, icône et libellé sur une seule ligne. */\n@media (max-width: 1089px) {\n  .mtx-repeat__remove {\n    width: 100%;\n    height: 40px;\n    gap: var(--mtx-space-8);\n    margin-top: var(--mtx-space-4);\n    border: var(--mtx-border-width-s) solid var(--mtx-icon-color-error);\n    border-radius: var(--mtx-radius-full);\n    font: var(--mtx-body-font-14-bold);\n    white-space: nowrap;\n  }\n  .mtx-repeat__remove svg { flex: 0 0 auto; }\n}\n\n.mtx-repeat__add {\n  display: flex;\n  justify-content: center;\n  min-width: 0;\n}\n\n\n\n/* ============================================================\n   COMPOSANT — Navigation d'étapes mobile (< 1090px)\n   ============================================================ */\n\n.mtx-stepper-mobile {\n  flex: 0 0 auto;\n  background: var(--mtx-surface-color-light);\n  padding: var(--mtx-space-12) var(--mtx-space-20);\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-16);\n}\n@media (min-width: 1090px) {\n  .mtx-stepper-mobile { display: none; }\n}\n/* Toute la largeur de l'en-tête déplie/replie le menu. */\n.mtx-stepper-mobile__head {\n  display: flex;\n  align-items: flex-start;\n  gap: var(--mtx-space-8);\n  cursor: pointer;\n  -webkit-tap-highlight-color: transparent;\n}\n.mtx-stepper-mobile__label {\n  flex: 1 1 auto;\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-4);\n  min-height: var(--mtx-icon-size-l);\n  color: var(--mtx-text-color-brand-alt);\n  font: var(--mtx-body-font-16-regular);\n}\n.mtx-stepper-mobile__label strong { font-weight: var(--mtx-font-weight-bold); }\n.mtx-stepper-mobile__toggle svg { transition: var(--mtx-transition-transform); }\n.mtx-stepper-mobile__toggle[aria-expanded=\"true\"] svg { transform: rotate(180deg); }\n\n/* Menu ouvert : liste « n / 7 - Nom » alignée sur l'en-tête replié,\n   sans puces, et voile sur le contenu situé dessous (maquette). */\n.mtx-stepper-mobile__list {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-24);\n  padding: var(--mtx-space-12) 0 var(--mtx-space-8);\n}\n\n/* Ouvert : le panneau se déplie AU-DESSUS du contenu (il ne le\n   pousse pas), sur un voile flouté qui couvre le reste de l'écran. */\n@media (max-width: 1089px) {\n  .mtx-stepper-mobile { position: relative; }\n  .mtx-stepper-mobile__list {\n    position: absolute;\n    top: 100%;\n    left: 0;\n    right: 0;\n    z-index: 2;\n    padding: var(--mtx-space-20) var(--mtx-space-20) var(--mtx-space-28);\n    background: var(--mtx-surface-color-light);\n    transform-origin: top center;\n  }\n  /* Ouverture : dépliage + apparition en cascade */\n  .mtx-stepper-mobile[data-anim=\"in\"] .mtx-stepper-mobile__list {\n    animation: mtx-steps-panel-in 300ms var(--mtx-ease-out) both;\n  }\n  .mtx-stepper-mobile[data-anim=\"in\"] .mtx-stepper-mobile__item {\n    animation: mtx-steps-item-in 260ms var(--mtx-ease-out) both;\n  }\n  .mtx-stepper-mobile[data-anim=\"in\"] .mtx-stepper-mobile__item:nth-child(1) { animation-delay: 40ms; }\n  .mtx-stepper-mobile[data-anim=\"in\"] .mtx-stepper-mobile__item:nth-child(2) { animation-delay: 75ms; }\n  .mtx-stepper-mobile[data-anim=\"in\"] .mtx-stepper-mobile__item:nth-child(3) { animation-delay: 110ms; }\n  .mtx-stepper-mobile[data-anim=\"in\"] .mtx-stepper-mobile__item:nth-child(4) { animation-delay: 145ms; }\n  .mtx-stepper-mobile[data-anim=\"in\"] .mtx-stepper-mobile__item:nth-child(5) { animation-delay: 180ms; }\n  .mtx-stepper-mobile[data-anim=\"in\"] .mtx-stepper-mobile__item:nth-child(6) { animation-delay: 215ms; }\n  .mtx-stepper-mobile[data-anim=\"in\"] .mtx-stepper-mobile__item:nth-child(7) { animation-delay: 250ms; }\n  /* Fermeture : repli doux, sans cascade (plus calme à l'œil) */\n  .mtx-stepper-mobile[data-closing=\"true\"] .mtx-stepper-mobile__list {\n    animation: mtx-steps-panel-out 380ms var(--mtx-ease-in-out) both;\n  }\n  .mtx-stepper-mobile[data-closing=\"true\"] .mtx-stepper-mobile__item {\n    animation: mtx-steps-item-out 200ms var(--mtx-ease-in-out) both;\n  }\n}\n@keyframes mtx-steps-panel-in {\n  from { opacity: 0; transform: translateY(-10px); clip-path: inset(0 0 100% 0); }\n  to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); }\n}\n@keyframes mtx-steps-item-in {\n  from { opacity: 0; transform: translateY(-6px); }\n  to { opacity: 1; transform: none; }\n}\n@keyframes mtx-steps-panel-out {\n  from { opacity: 1; transform: none; clip-path: inset(0 0 0 0); }\n  to { opacity: 0; transform: translateY(-6px); clip-path: inset(0 0 100% 0); }\n}\n@keyframes mtx-steps-item-out {\n  from { opacity: 1; }\n  to { opacity: 0; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .mtx-stepper-mobile__list,\n  .mtx-stepper-mobile__item,\n  .mtx-stepper-mobile::after { animation: none; }\n}\n.mtx-stepper-mobile__item {\n  display: flex;\n  align-items: baseline;\n  gap: var(--mtx-space-8);\n}\n.mtx-stepper-mobile__item[hidden] { display: none; }\n.mtx-stepper-mobile__index,\n.mtx-stepper-mobile__sep,\n.mtx-stepper-mobile__name {\n  font: var(--mtx-body-font-16-regular);\n  color: var(--mtx-text-color-brand-alt);\n}\n/* Étapes à venir : gris clair */\n.mtx-stepper-mobile__item[data-state=\"upcoming\"] .mtx-stepper-mobile__index,\n.mtx-stepper-mobile__item[data-state=\"upcoming\"] .mtx-stepper-mobile__sep,\n.mtx-stepper-mobile__item[data-state=\"upcoming\"] .mtx-stepper-mobile__name {\n  color: var(--mtx-text-color-tertiary);\n}\n.mtx-stepper-mobile__index,\n.mtx-stepper-mobile__sep { white-space: nowrap; }\n\n.mtx-stepper-mobile[data-open=\"true\"] {\n  position: relative;\n  z-index: 30;\n}\n.mtx-stepper-mobile[data-open=\"true\"]::after {\n  content: \"\";\n  position: absolute;\n  inset: 100% 0 auto 0;\n  z-index: 1;\n  height: 100vh;\n  background: rgba(48, 46, 45, 0.28);\n  backdrop-filter: blur(6px);\n  pointer-events: auto;\n  transition: opacity 380ms var(--mtx-ease-in-out);\n  animation: mtx-scrim-in 300ms var(--mtx-ease-out) both;\n}\n.mtx-stepper-mobile[data-closing=\"true\"]::after {\n  animation: mtx-scrim-out 380ms var(--mtx-ease-in-out) both;\n  pointer-events: none;\n}\n@keyframes mtx-scrim-in {\n  from { opacity: 0; backdrop-filter: blur(0); }\n  to { opacity: 1; backdrop-filter: blur(6px); }\n}\n@keyframes mtx-scrim-out {\n  from { opacity: 1; backdrop-filter: blur(6px); }\n  to { opacity: 0; backdrop-filter: blur(0); }\n}\n\n/* ============================================================\n   COMPOSANT — Note Trustpilot (en-tête)\n   ============================================================ */\n\n.mtx-trust {\n  flex: 0 0 auto;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: var(--mtx-space-2);\n}\n.mtx-trust__row {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-8);\n}\n.mtx-trust__wordmark { height: 22px; width: auto; }\n.mtx-trust__stars { height: var(--mtx-icon-size-s); width: auto; }\n.mtx-trust__caption {\n  font: var(--mtx-body-font-14-regular);\n  color: var(--mtx-text-color-primary);\n}\n\n/* ============================================================\n   COMPOSANT — Grille de logos partenaires\n   ============================================================ */\n\n/* Mobile : 4 logos par rangée (cf. maquettes mobiles) */\n.mtx-partner-grid {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: var(--mtx-space-20) var(--mtx-space-12);\n  align-items: center;\n  justify-items: center;\n}\n@media (min-width: 768px) {\n  .mtx-partner-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }\n}\n.mtx-partner-grid__logo {\n  max-width: 100%;\n  height: 22px;\n  object-fit: contain;\n}\n/* La mention « … » termine la grille sur sa propre rangée en mobile */\n@media (max-width: 767px) {\n  .mtx-partner-grid__more { grid-column: 1 / -1; }\n}\n.mtx-partner-grid__more {\n  font: var(--mtx-heading-font-20-bold);\n  color: var(--mtx-text-color-brand-alt);\n  letter-spacing: var(--mtx-letter-spacing-wide);\n}\n\n/* ============================================================\n   COMPOSANT — Liste de statistiques picto + valeur\n   ============================================================ */\n\n.mtx-stat-list {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-16);\n}\n.mtx-stat {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-12);\n}\n.mtx-stat__icon { width: 36px; height: 36px; flex: 0 0 auto; }\n.mtx-stat__text {\n  font: var(--mtx-body-font-16-regular);\n  color: var(--mtx-text-color-brand-alt);\n}\n.mtx-stat__value { font-weight: var(--mtx-font-weight-bold); }\n\n/* ============================================================\n   COMPOSANT — Compteur pas-à-pas (nombre de mois)\n   ============================================================ */\n\n.mtx-counter {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-8);\n}\n.mtx-counter__value {\n  height: 40px;\n  min-width: 88px;\n  padding-inline: var(--mtx-space-12);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--mtx-space-4);\n  border: var(--mtx-border-width-s) solid var(--mtx-border-color-light);\n  border-radius: var(--mtx-radius-s);\n  background: var(--mtx-surface-color-light);\n  font: var(--mtx-heading-font-16-regular);\n  color: var(--mtx-text-color-primary);\n}\n\n\n/* ============================================================\n   PAGE — Tunnel crédit immobilier\n   Règles strictement propres à cet écran : transitions de\n   question, blocs emprunteur, total du financement, écran\n   d'étude du dossier.\n   ============================================================ */\n\n/* Zone animée qui porte la question courante */\n.tunnel__box { height: auto; }\n.tunnel__screen {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-20);\n}\n\n/* Groupe d'un emprunteur (répété si emprunt à deux) */\n.tunnel__borrower {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-24);\n  padding: var(--mtx-space-12) 0 var(--mtx-space-32);\n}\n.tunnel__borrower-title {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-8);\n  color: var(--mtx-text-color-brand-alt);\n  font: var(--mtx-body-font-14-bold);\n  letter-spacing: var(--mtx-letter-spacing-wide);\n}\n.tunnel__borrower-title img { width: var(--mtx-icon-size-m); height: var(--mtx-icon-size-m); }\n.tunnel__divider {\n  height: var(--mtx-border-width-s);\n  background: var(--mtx-border-color-light);\n  margin-bottom: var(--mtx-space-20);\n}\n\n/* Empilement générique des sections d'une question */\n.tunnel__stack {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-20);\n}\n.tunnel__stack--l { gap: var(--mtx-space-24); }\n.tunnel__stack--s { gap: var(--mtx-space-8); }\n.tunnel__row {\n  display: flex;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: var(--mtx-space-12);\n  min-width: 0;\n}\n.tunnel__row--nowrap { flex-wrap: nowrap; }\n.tunnel__row--between > .tunnel__legal { min-width: 0; }\n.tunnel__inline-label {\n  font: var(--mtx-heading-font-16-bold);\n  color: var(--mtx-text-color-primary);\n}\n.tunnel__amount { flex: 0 0 200px; min-width: 150px; position: relative; }\n\n/* Mobile : le champ occupe la ligne, les contrôles associés\n   (compteur de mois, fréquence des primes) passent dessous,\n   ferrés à droite comme sur les maquettes mobiles. */\n@media (max-width: 1089px) {\n  .tunnel__amount { flex: 1 1 100%; }\n  .tunnel__row { justify-content: flex-end; }\n  .tunnel__row--nowrap,\n  .tunnel__row--between { justify-content: space-between; }\n  /* La question garde la place restante, la réponse reste sur la ligne */\n  .tunnel__row--between { flex-wrap: nowrap; }\n  .tunnel__row--between > .tunnel__legal { flex: 1 1 auto; }\n  .tunnel__row--between .mtx-chip-group { flex: 0 0 auto; }\n}\n\n/* Champ téléphone : indicatif fixe + numéro fluide */\n.tunnel__phone-prefix { flex: 0 0 104px; }\n.tunnel__phone-number { flex: 1 1 auto; }\n\n/* Total du crédit (écran financement) */\n.tunnel__total {\n  display: flex;\n  justify-content: flex-end;\n  padding-top: var(--mtx-space-4);\n}\n.tunnel__total-inner {\n  display: flex;\n  align-items: baseline;\n  gap: var(--mtx-space-20);\n}\n.tunnel__total-labels {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-end;\n}\n.tunnel__total-title {\n  font: var(--mtx-heading-font-16-bold);\n  color: var(--mtx-text-color-primary);\n  letter-spacing: var(--mtx-letter-spacing-wide);\n}\n.tunnel__total-detail {\n  font: var(--mtx-caption-font-s);\n  font-weight: var(--mtx-font-weight-regular);\n  color: var(--mtx-text-color-primary);\n}\n.tunnel__total-detail:hover { color: var(--mtx-text-color-primary); }\n\n/* Libellés longs autorisés à passer sur deux lignes */\n.tunnel__label--wrap {\n  white-space: normal;\n  max-width: 260px;\n  line-height: 1.4;\n  text-wrap: balance;\n}\n.tunnel__total-value {\n  font: var(--mtx-heading-font-30-bold);\n  color: var(--mtx-text-color-brand);\n  white-space: nowrap;\n}\n\n/* Conseiller choisi */\n.tunnel__advisor {\n  display: flex;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: var(--mtx-space-8) var(--mtx-space-16);\n  background: var(--mtx-surface-color-brand-alt-light);\n  border-radius: var(--mtx-radius-l);\n  padding: 18px var(--mtx-space-24);\n  font: var(--mtx-body-font-16-regular);\n}\n.tunnel__advisor strong { font-weight: var(--mtx-font-weight-bold); }\n\n.tunnel__legal {\n  font: var(--mtx-body-font-16-regular);\n  color: var(--mtx-text-color-primary);\n  text-wrap: pretty;\n}\n\n/* Écran « Nous étudions votre dossier » ---------------------- */\n.tunnel__study {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-24);\n}\n.tunnel__study-title {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-12);\n  font: var(--mtx-body-font-16-bold);\n  color: var(--mtx-text-color-primary);\n}\n@media (min-width: 1090px) {\n  .tunnel__study-title { font: var(--mtx-heading-font-26-bold); }\n  .tunnel__study { gap: var(--mtx-space-40); }\n}\n.tunnel__study-emoji { font-size: var(--mtx-font-size-20); line-height: 1; }\n@media (min-width: 1090px) {\n  .tunnel__study-emoji { font-size: var(--mtx-font-size-26); }\n}\n\n.tunnel__study-grid {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr);\n  gap: var(--mtx-space-24);\n  align-items: start;\n}\n@media (min-width: 1090px) {\n  .tunnel__study-grid {\n    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);\n    gap: var(--mtx-space-40);\n  }\n}\n.tunnel__study-col {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-24);\n  min-width: 0;\n}\n.tunnel__study-heading {\n  align-self: center;\n  font: var(--mtx-heading-font-16-bold);\n  color: var(--mtx-text-color-brand-alt);\n  letter-spacing: var(--mtx-letter-spacing-wide);\n  text-align: center;\n}\n.tunnel__security {\n  border-radius: var(--mtx-radius-l);\n  padding: var(--mtx-space-20) var(--mtx-space-24);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--mtx-space-12);\n  background: var(--mtx-surface-color-warning);\n  color: var(--mtx-text-color-warning-on-surface);\n  font: var(--mtx-body-font-14-bold);\n  letter-spacing: var(--mtx-letter-spacing-wide);\n  text-align: center;\n}\n\n/* Mobile : rythme vertical resserré (maquettes) — libellés, champs\n   et cases à cocher respirent à 16px et non 20/24px. */\n@media (max-width: 1089px) {\n  .tunnel__screen { gap: var(--mtx-space-16); }\n  /* 20px entre un champ et le libellé du bloc suivant */\n  .tunnel__stack,\n  .tunnel__stack--l { gap: var(--mtx-space-20); }\n  .tunnel__borrower {\n    gap: var(--mtx-space-16);\n    padding: var(--mtx-space-4) 0 var(--mtx-space-16);\n  }\n}\n\n<\u002Fstyle>\n<!-- Ressources chargées depuis le JavaScript : déclarées ici pour\n     l'export en fichier autonome (cf. utils/dom.js → asset()). -->\n\n\n\n\n\n\n\n\n\n\n\n\n\n<\u002Fhead>\n<body>\n\n<div class=\"l-app\">\n\n  <!-- En-tête desktop ------------------------------------------------ -->\n  <header class=\"l-header l-header--desktop\" data-role=\"header-desktop\">\n    <a href=\"./index.html\" aria-label=\"Meilleurtaux — accueil\">\n      <img class=\"l-header__logo\" src=\"2c0a0503-55a7-4fd7-8a38-7529302facab\" alt=\"Meilleurtaux — Placement · Assurance · Crédit\">\n    <\u002Fa>\n    <div class=\"mtx-trust\">\n      <div class=\"mtx-trust__row\">\n        <img class=\"mtx-trust__wordmark\" src=\"2a96f21a-b39a-46e2-b68c-ccf0bb9e548a\" alt=\"Trustpilot\">\n        <img class=\"mtx-trust__stars\" src=\"e30f579e-aea5-4aaa-8fd8-c85011f94ac0\" alt=\"Noté 4,8 sur 5\">\n      <\u002Fdiv>\n      <span class=\"mtx-trust__caption\">(4.8/5 - 10784 avis)<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- En-tête mobile ------------------------------------------------- -->\n  <header class=\"l-header\" data-role=\"header-mobile\">\n    <button type=\"button\" class=\"mtx-button mtx-button--plain\" data-role=\"header-back\" data-action=\"back\" aria-label=\"Étape précédente\">\n      <span data-icon=\"arrow-left\"><\u002Fspan>\n    <\u002Fbutton>\n    <div class=\"l-header__center\">\n      <img class=\"l-header__logo--symbol\" src=\"e4a6137c-d87d-4fb6-9825-277bde8cf247\" alt=\"Meilleurtaux\">\n    <\u002Fdiv>\n    <img class=\"mtx-trust__stars\" src=\"e30f579e-aea5-4aaa-8fd8-c85011f94ac0\" alt=\"Noté 4,8 sur 5\">\n  <\u002Fheader>\n\n  <!-- Navigation d'étapes mobile ------------------------------------- -->\n  <nav class=\"mtx-stepper-mobile\" data-role=\"stepper-mobile\" aria-label=\"Étapes du parcours\">\n    <div class=\"mtx-stepper-mobile__head\" data-action=\"toggle-steps\">\n      <p class=\"mtx-stepper-mobile__label\">\n        <strong data-bind=\"step-index\">1<\u002Fstrong>\n        <span>/ 7<\u002Fspan>\n        <span aria-hidden=\"true\">-<\u002Fspan>\n        <strong data-bind=\"step-name\">Votre projet<\u002Fstrong>\n      <\u002Fp>\n      <button type=\"button\" class=\"mtx-button mtx-button--plain mtx-stepper-mobile__toggle\" data-action=\"toggle-steps\" aria-expanded=\"false\" aria-controls=\"steps-mobile-list\" aria-label=\"Voir toutes les étapes\">\n        <span data-icon=\"chevron-down-big\"><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"mtx-progress mtx-progress--s\">\n      <div class=\"mtx-progress__bar\" data-bind=\"step-progress\"><\u002Fdiv>\n    <\u002Fdiv>\n    <ol class=\"mtx-stepper-mobile__list\" id=\"steps-mobile-list\" data-role=\"stepper-mobile-list\" hidden=\"\"><\u002Fol>\n  <\u002Fnav>\n\n  <div class=\"l-body\">\n    <div class=\"l-shell\">\n\n      <!-- Affiché tant que le JavaScript n'a pas démarré (JS désactivé ou erreur) -->\n      <div class=\"mtx-callout mtx-callout--warning\" data-role=\"boot-notice\">\n        <div class=\"mtx-callout__head\">\n          <p class=\"mtx-callout__title\">JavaScript est nécessaire pour afficher le parcours<\u002Fp>\n        <\u002Fdiv>\n        <p class=\"mtx-callout__text\">\n          Activez JavaScript dans votre navigateur, puis rechargez la page.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <!-- Parcours ---------------------------------------------------- -->\n      <div class=\"l-funnel\" data-role=\"funnel\" hidden=\"\">\n        <nav class=\"mtx-stepper\" data-role=\"stepper\" aria-label=\"Étapes du parcours\">\n          <div class=\"mtx-stepper__rail\" data-bind=\"rail\"><\u002Fdiv>\n          <div class=\"mtx-stepper__rail-fill\" data-bind=\"rail-fill\"><\u002Fdiv>\n        <\u002Fnav>\n\n        <main class=\"l-funnel__main\">\n\n          <aside class=\"mtx-banner\" data-role=\"banner\" hidden=\"\">\n            <div class=\"mtx-banner__main\">\n              <span data-icon=\"home\" aria-hidden=\"true\"><\u002Fspan>\n              <div class=\"mtx-banner__body\">\n                <span class=\"mtx-banner__title\">CRÉDIT IMMOBILIER<\u002Fspan>\n                <span class=\"mtx-banner__text\">Obtenez une estimation en quelques clics<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p class=\"mtx-banner__meta\">GRATUIT et SANS ENGAGEMENT<\u002Fp>\n          <\u002Faside>\n\n          <!-- Erreurs non liées à un champ (réseau, serveur, session) -->\n          <div data-role=\"form-alert\" hidden=\"\"><\u002Fdiv>\n\n          <section class=\"mtx-card mtx-card--elevated\" data-role=\"card\" aria-live=\"polite\">\n            <button type=\"button\" class=\"mtx-card__info\" data-action=\"open-formula\" data-role=\"info-button\" aria-label=\"En savoir plus sur cette question\" hidden=\"\">\n              <img src=\"60951b9a-f63e-4f19-8e0d-f40d02caeb62\" alt=\"\" width=\"28\" height=\"28\">\n            <\u002Fbutton>\n\n            <div class=\"tunnel__box\" data-role=\"box\">\n              <div class=\"tunnel__screen\" data-role=\"screen\">\n                <p class=\"mtx-status-pill\" data-role=\"status-pill\" hidden=\"\">\n                  <span data-icon=\"flag-checkered\" aria-hidden=\"true\"><\u002Fspan>\n                  <span>Dernière étape avant de découvrir votre financement<\u002Fspan>\n                <\u002Fp>\n                <h1 class=\"mtx-card__title\" data-bind=\"question\"><\u002Fh1>\n                <div data-role=\"screen-body\"><\u002Fdiv>\n                <div class=\"mtx-callout\" data-role=\"tip\" hidden=\"\">\n                  <div class=\"mtx-callout__head\">\n                    <img src=\"b07b6688-6795-41ff-b70f-626318eba9b7\" alt=\"\" width=\"26\" height=\"26\">\n                    <p class=\"mtx-callout__title\" data-bind=\"tip-title\"><\u002Fp>\n                  <\u002Fdiv>\n                  <p class=\"mtx-callout__text\" data-bind=\"tip-text\"><\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <nav class=\"mtx-card__actions\" data-role=\"actions\" aria-label=\"Navigation du parcours\">\n              <button type=\"button\" class=\"mtx-button mtx-button--secondary mtx-button--icon\" data-action=\"back\" data-role=\"back-button\" aria-label=\"Étape précédente\" hidden=\"\">\n                <span data-icon=\"arrow-left\"><\u002Fspan>\n              <\u002Fbutton>\n              <button type=\"button\" class=\"mtx-button mtx-button--primary mtx-card__actions-end\" data-action=\"next\" data-role=\"next-button\" hidden=\"\">\n                <span data-bind=\"next-label\">Continuer<\u002Fspan>\n                <span data-icon=\"arrow-right\"><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fnav>\n          <\u002Fsection>\n\n        <\u002Fmain>\n      <\u002Fdiv>\n\n      <!-- Écran d'étude du dossier ------------------------------------ -->\n      <section class=\"mtx-card mtx-card--elevated\" data-role=\"study\" hidden=\"\">\n        <div class=\"tunnel__study\">\n          <h1 class=\"tunnel__study-title\">\n            <span class=\"tunnel__study-emoji\" aria-hidden=\"true\">⌛<\u002Fspan>\n            NOUS ÉTUDIONS VOTRE DOSSIER\n          <\u002Fh1>\n\n          <div class=\"tunnel__study-grid\">\n            <div class=\"tunnel__study-col\">\n              <div class=\"tunnel__stack tunnel__stack--s\">\n                <div class=\"mtx-progress-head\">\n                  <span class=\"mtx-progress-head__label\">Progression<\u002Fspan>\n                  <span class=\"mtx-progress-head__value\" data-bind=\"study-percent\">0%<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"mtx-progress mtx-progress--brand\">\n                  <div class=\"mtx-progress__bar\" data-bind=\"study-progress\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <ol class=\"mtx-task-list\" data-role=\"task-list\"><\u002Fol>\n            <\u002Fdiv>\n\n            <div class=\"tunnel__study-col\">\n              <div class=\"mtx-card mtx-card--surface\">\n                <p class=\"tunnel__study-heading\">POURQUOI NOUS CHOISIR ?<\u002Fp>\n                <ul class=\"mtx-stat-list\">\n                  <li class=\"mtx-stat\">\n                    <img class=\"mtx-stat__icon\" src=\"235f3982-6b77-4189-960b-502cfdda3e43\" alt=\"\">\n                    <span class=\"mtx-stat__text\"><span class=\"mtx-stat__value\">+22 000<\u002Fspan> projets financés en 2025<\u002Fspan>\n                  <\u002Fli>\n                  <li class=\"mtx-stat\">\n                    <img class=\"mtx-stat__icon\" src=\"4fa50499-297a-4e6b-9143-287b2e63847e\" alt=\"\">\n                    <span class=\"mtx-stat__text\"><span class=\"mtx-stat__value\">+100<\u002Fspan> Partenaires bancaires<\u002Fspan>\n                  <\u002Fli>\n                  <li class=\"mtx-stat\">\n                    <img class=\"mtx-stat__icon\" src=\"e0b48051-71fb-47e4-81ea-682a5ed2d6c7\" alt=\"\">\n                    <span class=\"mtx-stat__text\"><span class=\"mtx-stat__value\">350<\u002Fspan> Agences en France<\u002Fspan>\n                  <\u002Fli>\n                <\u002Ful>\n                <ul class=\"mtx-partner-grid\" data-role=\"partner-grid\"><\u002Ful>\n              <\u002Fdiv>\n\n              <p class=\"tunnel__security\">\n                <span data-icon=\"lock\" aria-hidden=\"true\"><\u002Fspan>\n                DONNÉES SÉCURISÉES ET CONFIDENTIELLES\n              <\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Modales ----------------------------------------------------------- -->\n<dialog class=\"mtx-modal\" data-role=\"formula-modal\" aria-labelledby=\"formula-title\">\n  <button type=\"button\" class=\"mtx-modal__close\" data-action=\"close-modal\" aria-label=\"Fermer\">\n    <span data-icon=\"close\"><\u002Fspan>\n  <\u002Fbutton>\n  <h2 class=\"mtx-modal__title\" id=\"formula-title\">Comment est calculé le montant total ?<\u002Fh2>\n  <div class=\"mtx-formula\" data-role=\"formula\"><\u002Fdiv>\n  <div class=\"mtx-modal__footer mtx-modal__footer--center\">\n    <button type=\"button\" class=\"mtx-button mtx-button--primary mtx-button--l\" data-action=\"close-modal\">J’ai compris<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdialog>\n\n<dialog class=\"mtx-modal\" data-role=\"advisor-modal\" aria-labelledby=\"advisor-title\">\n  <button type=\"button\" class=\"mtx-modal__close\" data-action=\"cancel-advisor\" aria-label=\"Fermer\">\n    <span data-icon=\"close\"><\u002Fspan>\n  <\u002Fbutton>\n  <div class=\"mtx-modal__body\">\n    <h2 class=\"mtx-modal__title\" id=\"advisor-title\">Choix de votre contact<\u002Fh2>\n    <p class=\"mtx-modal__text\">Saisissez l’email du conseiller auquel vous souhaitez être rattaché.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"mtx-field\">\n    <label class=\"mtx-field__label\" for=\"advisor-email\">Email de votre contact *<\u002Flabel>\n    <div class=\"mtx-field__control\">\n      <input class=\"mtx-input mtx-input--l\" id=\"advisor-email\" type=\"email\" placeholder=\"Ex : o.durand@meilleurtaux.com\" data-bind=\"advisor-email\">\n    <\u002Fdiv>\n    <p class=\"mtx-field__error\" data-role=\"advisor-error\" hidden=\"\">Merci de saisir un email valide.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"mtx-modal__footer\">\n    <button type=\"button\" class=\"mtx-button mtx-button--secondary mtx-button--l\" data-action=\"cancel-advisor\">Annuler<\u002Fbutton>\n    <button type=\"button\" class=\"mtx-button mtx-button--primary mtx-button--l\" data-action=\"confirm-advisor\">Valider<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdialog>\n\n<!-- Fragments réutilisables ------------------------------------------ -->\n<template id=\"tpl-stepper-item\">\n  <li class=\"mtx-stepper__item\">\n    <div class=\"mtx-stepper__gutter\">\n      <span class=\"mtx-stepper__gutter-line\" data-role=\"line-top\"><\u002Fspan>\n      <span class=\"mtx-stepper__dot\" data-role=\"dot\"><span data-icon=\"check-small\"><\u002Fspan><\u002Fspan>\n      <span class=\"mtx-stepper__gutter-line\" data-role=\"line-bottom\"><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"mtx-stepper__card\">\n      <p class=\"mtx-stepper__badge\">\n        <span data-icon=\"trophy\" data-role=\"trophy\" aria-hidden=\"true\" hidden=\"\"><\u002Fspan>\n        <span class=\"mtx-stepper__index\" data-bind=\"index\"><\u002Fspan>\n      <\u002Fp>\n      <p class=\"mtx-stepper__name\" data-bind=\"name\"><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fli>\n<\u002Ftemplate>\n\n<template id=\"tpl-stepper-mobile-item\">\n  <li class=\"mtx-stepper-mobile__item\">\n    <span class=\"mtx-stepper-mobile__index\" data-bind=\"index\"><\u002Fspan>\n    <span class=\"mtx-stepper-mobile__sep\" aria-hidden=\"true\">-<\u002Fspan>\n    <span class=\"mtx-stepper-mobile__name\" data-bind=\"name\"><\u002Fspan>\n  <\u002Fli>\n<\u002Ftemplate>\n\n<template id=\"tpl-task\">\n  <li class=\"mtx-task\">\n    <span class=\"mtx-task__badge\" data-role=\"badge\"><\u002Fspan>\n    <span class=\"mtx-task__label\" data-bind=\"label\"><\u002Fspan>\n  <\u002Fli>\n<\u002Ftemplate>\n\n<template id=\"tpl-choice\">\n  <button type=\"button\" class=\"mtx-choice\" role=\"radio\" aria-checked=\"false\">\n    <span class=\"mtx-choice__radio\" aria-hidden=\"true\"><\u002Fspan>\n    <span class=\"mt
