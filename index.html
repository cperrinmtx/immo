document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"fr\" data-brand=\"meilleurtaux\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Meilleurtaux — Tunnel crédit immobilier<\u002Ftitle>\n<meta name=\"description\" content=\"Parcours de simulation de crédit immobilier Meilleurtaux — prototype front-end.\">\n<style>/* ============================================================\n   Tunnel Immo — feuille de style racine\n   Ordre d'import = ordre de cascade (fondations → composants → page)\n   ------------------------------------------------------------\n   1. tokens.css      : design system (NE PAS MODIFIER)\n   2. base.css        : reset + styles élémentaires\n   3. layout.css      : gabarits d'écran, conteneurs, grilles\n   4. components/*    : composants réutilisables (un fichier par composant)\n   5. pages/tunnel.css: règles strictement propres au parcours\n   ============================================================ */\n\n/* ============================================================\n   Meilleurtaux — Design Tokens (Primitives + Aliases)\n   Aligné sur la Charte graphique + UI Kit MTX (Figma)\n   ============================================================\n\n   Architecture en 3 couches :\n\n   1. PRIMITIVES   — valeurs brutes, indépendantes du contexte.\n                     Convention : --<famille>-<échelle>\n                     Échelles couleur : 0 → 50 → 100..900\n                     (mappées sur les paliers Figma 0 / 0.5 / 1..9)\n\n                     • Palier de base : 500 (900 pour Gris)\n                     • Texte sur background 50 : utiliser le 600\n                       pour assurer un contraste WCAG AA\n\n   2. BRAND        — alias qui basculent selon [data-brand=\"...\"].\n                     --mtx-brand-primary, --mtx-brand-secondary, etc.\n\n   3. SEMANTIC     — tokens d'USAGE, ce que les composants consomment.\n                     --mtx-surface-*, --mtx-text-*, --mtx-icon-*, --mtx-border-*, --mtx-action-*\n                     Ne JAMAIS utiliser une primitive directement dans un composant.\n\n   Switch de marque via [data-brand=\"meilleurtaux\"] ou [data-brand=\"placement\"]\n   sur <html> ou un sous-arbre.\n   ============================================================ */\n\n\n/* -----------------------------------------------------------\n   FONT FACE\n   ----------------------------------------------------------- */\n@font-face {\n  font-family: \"DM Sans\";\n  src: url(\"30df92c7-47c6-4c58-81dc-1d1432c47821\") format(\"truetype-variations\");\n  font-weight: 100 1000;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"DM Sans\";\n  src: url(\"1d903231-7d27-4748-926e-6c9fee1f42e5\") format(\"truetype-variations\");\n  font-weight: 100 1000;\n  font-style: italic;\n  font-display: swap;\n}\n\n\n/* ============================================================\n   1.  PRIMITIVES — COULEURS\n   ============================================================ */\n:root {\n\n  /* ---- Terracotta — Primary Meilleurtaux / Secondary Placement -- */\n  --mtx-terracotta-50:   #FFF0EC;\n  --mtx-terracotta-100:  #FFD1C5;\n  --mtx-terracotta-200:  #EDB1A2;\n  --mtx-terracotta-300:  #E59D8C;\n  --mtx-terracotta-400:  #CD7661;\n  --mtx-terracotta-500:  #C0543A;  /* base */\n  --mtx-terracotta-600:  #9A432E;  /* texte sur bg 50 */\n  --mtx-terracotta-700:  #733223;\n  --mtx-terracotta-800:  #4D2217;\n  --mtx-terracotta-900:  #26110C;\n\n  /* ---- Moka — Primary Placement ----------------------------- */\n  --mtx-moka-50:   #F9F6F1;   /* = Cream */\n  --mtx-moka-100:  #F1EBDF;\n  --mtx-moka-200:  #E2D4BB;   /* = Sand */\n  --mtx-moka-300:  #C6B59D;   /* = Sand-soft */\n  --mtx-moka-400:  #917D67;\n  --mtx-moka-500:  #77604B;   /* base */\n  --mtx-moka-600:  #584737;   /* texte sur bg 50 (= Marron historique) */\n  --mtx-moka-700:  #473A2D;\n  --mtx-moka-800:  #30261E;\n  --mtx-moka-900:  #18130F;   /* = Deep */\n\n  /* ---- Marron — Secondary Meilleurtaux ---------------------- */\n  --mtx-marron-50:   #F9F4F1;\n  --mtx-marron-100:  #EEE3DD;\n  --mtx-marron-200:  #D8BEAF;\n  --mtx-marron-300:  #B48C75;\n  --mtx-marron-400:  #915B3B;\n  --mtx-marron-500:  #6D3311;   /* base */\n  --mtx-marron-600:  #57290E;   /* texte sur bg 50 */\n  --mtx-marron-700:  #411F0A;\n  --mtx-marron-800:  #2C1407;\n  --mtx-marron-900:  #160A03;\n\n  /* ---- Gris — texte, bordures, surfaces --------------------- */\n  --mtx-gris-50:   #F9F9F9;\n  --mtx-gris-100:  #ECECEC;\n  --mtx-gris-200:  #D3D3D3;   /* = ligne / border par défaut */\n  --mtx-gris-300:  #B9B9B9;\n  --mtx-gris-400:  #A0A0A0;\n  --mtx-gris-500:  #868686;\n  --mtx-gris-600:  #6D6D6D;   /* texte tertiaire */\n  --mtx-gris-700:  #535353;   /* texte secondaire */\n  --mtx-gris-800:  #3A3A3A;\n  --mtx-gris-900:  #2E2E2E;   /* base — texte body */\n\n  /* ---- Bleu -------------------------------------------------- */\n  --mtx-bleu-50:  #F0F7FE;\n  --mtx-bleu-100: #E1EFFF;\n  --mtx-bleu-200: #C9E2FF;\n  --mtx-bleu-300: #ACD4FC;\n  --mtx-bleu-400: #64ABF3;\n  --mtx-bleu-500: #1073EA;   /* base */\n  --mtx-bleu-600: #0C4EB1;   /* texte sur bg 50 */\n  --mtx-bleu-700: #0F348A;\n  --mtx-bleu-800: #162664;\n  --mtx-bleu-900: #091335;\n\n  /* ---- Vert -------------------------------------------------- */\n  --mtx-vert-50:  #E9F7EF;\n  --mtx-vert-100: #BCE6CE;\n  --mtx-vert-200: #9CDAB6;\n  --mtx-vert-300: #6EC994;\n  --mtx-vert-400: #52BE80;\n  --mtx-vert-500: #239E57;   /* base */\n  --mtx-vert-600: #1C7C44;   /* texte sur bg 50 */\n  --mtx-vert-700: #156035;\n  --mtx-vert-800: #104928;\n  --mtx-vert-900: #082112;\n\n  /* ---- Jaune ------------------------------------------------- */\n  --mtx-jaune-50:  #FFF8E6;\n  --mtx-jaune-100: #FEEBB0;\n  --mtx-jaune-200: #FDE18A;\n  --mtx-jaune-300: #FCD354;\n  --mtx-jaune-400: #FCCA33;\n  --mtx-jaune-500: #FBBD00;   /* base */\n  --mtx-jaune-600: #E4AC00;   /* texte sur bg 50 */\n  --mtx-jaune-700: #B28600;\n  --mtx-jaune-800: #8A6800;\n  --mtx-jaune-900: #694F00;\n\n  /* ---- Rouge ------------------------------------------------- */\n  --mtx-rouge-50:  #FEECEC;\n  --mtx-rouge-100: #FDC4C4;\n  --mtx-rouge-200: #FCA8A8;\n  --mtx-rouge-300: #FA8080;\n  --mtx-rouge-400: #DE6A68;\n  --mtx-rouge-500: #D5413E;   /* base */\n  --mtx-rouge-600: #B82B28;   /* texte sur bg 50 */\n  --mtx-rouge-700: #8E211F;\n  --mtx-rouge-800: #641716;\n  --mtx-rouge-900: #3A0E0D;\n\n\n  /* ---- Blanc & Noir — valeurs fixes ------------------------- */\n  --mtx-blanc:  #FFFFFF;\n  --mtx-noir:   #302E2D;\n\n\n  /* ============================================================\n     2.  PRIMITIVES — ESPACEMENTS (grille 4px)\n     ============================================================ */\n  --mtx-space-0:    0px;\n  --mtx-space-1:    1px;\n  --mtx-space-2:    2px;\n  --mtx-space-4:    4px;\n  --mtx-space-8:    8px;\n  --mtx-space-12:   12px;\n  --mtx-space-16:   16px;\n  --mtx-space-20:   20px;\n  --mtx-space-24:   24px;\n  --mtx-space-28:   28px;\n  --mtx-space-32:   32px;\n  --mtx-space-40:   40px;\n  --mtx-space-48:   48px;\n  --mtx-space-64:   64px;\n  --mtx-space-72:   72px;\n  --mtx-space-80:   80px;\n  --mtx-space-96:   96px;\n  --mtx-space-128:  128px;   /* gap section desktop */\n  --mtx-space-160:  160px;\n  --mtx-space-192:  192px;\n  --mtx-space-256:  256px;\n\n  /* Espacements négatifs (marges de tirage, offsets) */\n  --mtx-space-1-neg:    -1px;\n  --mtx-space-2-neg:    -2px;\n  --mtx-space-4-neg:    -4px;\n  --mtx-space-8-neg:    -8px;\n  --mtx-space-12-neg:   -12px;\n  --mtx-space-16-neg:   -16px;\n  --mtx-space-20-neg:   -20px;\n  --mtx-space-24-neg:   -24px;\n  --mtx-space-28-neg:   -28px;\n  --mtx-space-32-neg:   -32px;\n  --mtx-space-40-neg:   -40px;\n  --mtx-space-48-neg:   -48px;\n  --mtx-space-64-neg:   -64px;\n  --mtx-space-72-neg:   -72px;\n  --mtx-space-80-neg:   -80px;\n  --mtx-space-96-neg:   -96px;\n  --mtx-space-128-neg:  -128px;\n  --mtx-space-160-neg:  -160px;\n  --mtx-space-192-neg:  -192px;\n  --mtx-space-256-neg:  -256px;\n\n\n  /* ============================================================\n     3.  PRIMITIVES — RADIUS\n     ============================================================ */\n  --mtx-radius-none:    0px;\n  --mtx-radius-xs:    4px;    /* inputs */\n  --mtx-radius-s:    8px;    /* badges, petits boutons */\n  --mtx-radius-m:   12px;\n  --mtx-radius-l:   16px;   /* cartes contenu */\n  --mtx-radius-xl:   24px;   /* blocs image */\n  --mtx-radius-2xl:   32px;\n  --mtx-radius-full: 1000px; /* pill */\n\n  /* Border widths */\n  --mtx-border-width-s:  1px;\n  --mtx-border-width-m:  2px;\n  --mtx-border-width-l:  3px;\n  --mtx-border-width-xl: 4px;\n\n\n  /* ============================================================\n     4.  PRIMITIVES — OMBRES\n     ============================================================ */\n  /* Shadows — échelle neutre (xs → xl) */\n  --mtx-shadow-xs: 0 1px 2px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.10);\n  --mtx-shadow-s: 0 2px 4px rgba(0,0,0,0.06), 0 4px 10px rgba(0,0,0,0.08);\n  --mtx-shadow-m: 0 4px 8px rgba(0,0,0,0.07), 0 6px 16px rgba(0,0,0,0.09);\n  --mtx-shadow-l: 0 6px 12px rgba(0,0,0,0.07), 0 10px 24px rgba(0,0,0,0.10);\n  --mtx-shadow-xl: 0 10px 20px rgba(0,0,0,0.08), 0 20px 48px rgba(0,0,0,0.12);\n\n\n  /* ============================================================\n     5.  PRIMITIVES — OPACITÉ\n     ============================================================ */\n  --mtx-opacity-transparent: 0;     /* @kind other */ /* masqué */\n  --mtx-opacity-light:       0.5;   /* @kind other */ /* voiles, désactivé léger */\n  --mtx-opacity-strong:      0.8;   /* @kind other */ /* surfaces translucides */\n  --mtx-opacity-solid:       1;     /* @kind other */ /* opaque */\n\n\n  /* ============================================================\n     6.  PRIMITIVES — MOTION (durées + courbes)\n     ============================================================ */\n  /* Durées — 3 seuils */\n  --mtx-duration-instant: 100ms;   /* @kind other */ /* micro-pression */\n  --mtx-duration-fast:    200ms;   /* @kind other */ /* hover, micro-feedback */\n  --mtx-duration-default: 300ms;   /* @kind other */ /* défaut transitions UI */\n\n  /* Courbes d'accélération */\n  --mtx-ease-out:       cubic-bezier(0.16, 1, 0.3, 1);     /* @kind other */ /* apparition */\n  --mtx-ease-in:        cubic-bezier(0.7, 0, 0.84, 0);     /* @kind other */ /* disparition */\n  --mtx-ease-in-out:    cubic-bezier(0.65, 0, 0.35, 1);    /* @kind other */ /* défaut — entrée/sortie */\n\n  /* Transitions composées (prêtes à l'emploi) */\n  --mtx-transition-color: color var(--mtx-duration-fast) var(--mtx-ease-in-out),\n                          background-color var(--mtx-duration-fast) var(--mtx-ease-in-out),\n                          border-color var(--mtx-duration-fast) var(--mtx-ease-in-out); /* @kind other */\n  --mtx-transition-transform: transform var(--mtx-duration-default) var(--mtx-ease-in-out); /* @kind other */\n  --mtx-transition-all: all var(--mtx-duration-default) var(--mtx-ease-in-out); /* @kind other */\n\n\n  /* ============================================================\n     7.  PRIMITIVES — TAILLES D'ICÔNES\n     Échelle Tailwind `size-N` (1 unité = 4px).\n     ============================================================ */\n  --mtx-icon-size-xs:   12px;   /* size-3  */\n  --mtx-icon-size-s:    16px;   /* size-4  */\n  --mtx-icon-size-m:    20px;   /* size-5  */\n  --mtx-icon-size-l:    24px;   /* size-6  */\n  --mtx-icon-size-xl:   32px;   /* size-8  */\n  --mtx-icon-size-2xl:  40px;   /* size-10 */\n  --mtx-icon-size-3xl:  48px;   /* size-12 */\n\n\n  /* ============================================================\n     8.  PRIMITIVES — BREAKPOINTS & LARGEURS DE DESIGN\n     ============================================================ */\n  /* Points de rupture — 2 seuils partagés (768 · 1090) */\n  --mtx-bp-tablet-min:   768px;\n  --mtx-bp-desktop-min:  1090px;\n  /* Largeurs de référence pour maquetter */\n  --mtx-design-tablet:       768px;\n  --mtx-design-desktop:      1440px;\n  --mtx-design-desktop-xl:   1920px;\n\n\n  /* ============================================================\n     9.  PRIMITIVES — GRILLE\n     ============================================================ */\n  /* Colonnes par viewport */\n  --mtx-grid-cols-desktop:   12;   /* @kind other */\n  --mtx-grid-cols-tablet:    8;    /* @kind other */\n  --mtx-grid-cols-mobile:    4;    /* @kind other */\n  /* Gouttières (gutters) */\n  --mtx-grid-gutter-desktop: 36px;\n  --mtx-grid-gutter-tablet:  24px;\n  --mtx-grid-gutter-mobile:  24px;\n  /* Marges latérales */\n  --mtx-grid-margin-desktop: 90px;   /* min */\n  --mtx-grid-margin-tablet:  16px;\n  --mtx-grid-margin-mobile:  16px;\n  /* Container max & colonnes fluides */\n  --mtx-grid-max-width-desktop: 1260px;  /* largeur max conteneur desktop */\n  --mtx-grid-container-tablet:  712px;   /* sur base écran 744px */\n  /* Colonnes fluides sur tous les viewports — aucune largeur de colonne fixe */\n\n\n  /* ============================================================\n     10. PRIMITIVES — TYPOGRAPHIE\n     ============================================================ */\n  --mtx-font-family-system:  system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --mtx-font-family-default: \"DM Sans\", var(--mtx-font-family-system);\n\n  /* Font-style */\n  --mtx-font-style-normal: normal;   /* @kind font */\n  --mtx-font-style-italic: italic;   /* @kind font */\n\n  /* Font-size scale */\n  --mtx-font-size-12: 12px;\n  --mtx-font-size-14: 14px;\n  --mtx-font-size-16: 16px;\n  --mtx-font-size-18: 18px;\n  --mtx-font-size-20: 20px;\n  --mtx-font-size-22: 22px;\n  --mtx-font-size-24: 24px;\n  --mtx-font-size-26: 26px;\n  --mtx-font-size-30: 30px;\n  --mtx-font-size-40: 40px;\n  --mtx-font-size-48: 48px;\n  --mtx-font-size-50: 50px;\n  --mtx-font-size-60: 60px;\n  --mtx-font-size-80: 80px;\n\n  /* Font-weight (400 / 600 / 700 uniquement) */\n  --mtx-font-weight-regular:  400;   /* @kind font */\n  --mtx-font-weight-semibold: 600;   /* @kind font */\n  --mtx-font-weight-bold:     700;   /* @kind font */\n\n  /* Line-height (Display 1.1 · Heading 1.4 · Body 1.6) */\n  --mtx-font-line-height-display:   1.10;   /* @kind font */\n  --mtx-font-line-height-heading: 1.40;   /* @kind font */\n  --mtx-font-line-height-body:    1.60;   /* @kind font */\n\n  /* Letter-spacing */\n  --mtx-ls-tight:   -0.01em;   /* @kind font */\n  --mtx-ls-snug:    -0.005em;  /* @kind font */\n  --mtx-ls-normal:  0;         /* @kind font */\n\n  /* Letter-spacing — échelle nommée (usage public) */\n  --mtx-letter-spacing-tight:  -0.02em;  /* @kind font */ /* titres, display serrés */\n  --mtx-letter-spacing-normal: 0;        /* @kind font */ /* corps, défaut */\n  --mtx-letter-spacing-wide:   0.06em;   /* @kind font */ /* labels, capitales, eyebrows */\n\n  /* ----------------------------------------------------------\n     Styles de texte — matrice catégorie × taille × graisse\n     Convention UI Kit MTX : <Catégorie>-font-<taille>, graisse en suffixe.\n     • Body    — line-height 1.6 — 12 / 14 / 16 / 18 / 20\n     • Heading — line-height 1.4 — 16 / 18 / 20 / 24 / 26 / 30 / 40\n     • Display — line-height 1.1 — 50 / 60 / 80\n     Graisses : regular 400 · semibold 600 · bold 700\n     ---------------------------------------------------------- */\n\n  /* Body (1.6) */\n  --mtx-body-font-12-regular:  400 12px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-12-semibold: 600 12px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-12-bold:     700 12px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-14-regular:  400 14px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-14-semibold: 600 14px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-14-bold:     700 14px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-16-regular:  400 16px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-16-semibold: 600 16px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-16-bold:     700 16px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-18-regular:  400 18px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-18-semibold: 600 18px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-18-bold:     700 18px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-20-regular:  400 20px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-20-semibold: 600 20px/1.6 var(--mtx-font-family-default);\n  --mtx-body-font-20-bold:     700 20px/1.6 var(--mtx-font-family-default);\n\n  /* Heading (1.4) */\n  --mtx-heading-font-16-regular:  400 16px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-16-semibold: 600 16px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-16-bold:     700 16px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-18-regular:  400 18px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-18-semibold: 600 18px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-18-bold:     700 18px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-20-regular:  400 20px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-20-semibold: 600 20px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-20-bold:     700 20px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-24-regular:  400 24px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-24-semibold: 600 24px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-24-bold:     700 24px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-26-regular:  400 26px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-26-semibold: 600 26px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-26-bold:     700 26px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-30-regular:  400 30px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-30-semibold: 600 30px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-30-bold:     700 30px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-40-regular:  400 40px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-40-semibold: 600 40px/1.4 var(--mtx-font-family-default);\n  --mtx-heading-font-40-bold:     700 40px/1.4 var(--mtx-font-family-default);\n\n  /* Display (1.1) */\n  --mtx-display-font-50-regular:  400 50px/1.1 var(--mtx-font-family-default);\n  --mtx-display-font-50-semibold: 600 50px/1.1 var(--mtx-font-family-default);\n  --mtx-display-font-50-bold:     700 50px/1.1 var(--mtx-font-family-default);\n  --mtx-display-font-60-regular:  400 60px/1.1 var(--mtx-font-family-default);\n  --mtx-display-font-60-semibold: 600 60px/1.1 var(--mtx-font-family-default);\n  --mtx-display-font-60-bold:     700 60px/1.1 var(--mtx-font-family-default);\n  --mtx-display-font-80-regular:  400 80px/1.1 var(--mtx-font-family-default);\n  --mtx-display-font-80-semibold: 600 80px/1.1 var(--mtx-font-family-default);\n  --mtx-display-font-80-bold:     700 80px/1.1 var(--mtx-font-family-default);\n\n  /* ----------------------------------------------------------\n     Styles fonctionnels — Label / Button / Caption\n     Déclinés en tailles s / m / l / xl. Le letter-spacing\n     associé est documenté côté page (font shorthand CSS ne\n     peut pas l'inclure).\n     ---------------------------------------------------------- */\n  /* Label (1.6 · ls 0) — 14 / 16 / 20 / 26 */\n  --mtx-label-font-s:  14px/1.6 var(--mtx-font-family-default);\n  --mtx-label-font-m:  16px/1.6 var(--mtx-font-family-default);\n  --mtx-label-font-l:  20px/1.6 var(--mtx-font-family-default);\n  --mtx-label-font-xl: 26px/1.6 var(--mtx-font-family-default);\n\n  /* Button (1.6 · ls 0) — 12 / 16 / 18 / 20 */\n  --mtx-button-font-s:  12px/1.6 var(--mtx-font-family-default);\n  --mtx-button-font-m:  16px/1.6 var(--mtx-font-family-default);\n  --mtx-button-font-l:  18px/1.6 var(--mtx-font-family-default);\n  --mtx-button-font-xl: 20px/1.6 var(--mtx-font-family-default);\n\n  /* Caption (1.6 · ls 0) — 12 / 14 / 16 */\n  --mtx-caption-font-s: 12px/1.6 var(--mtx-font-family-default);\n  --mtx-caption-font-m: 14px/1.6 var(--mtx-font-family-default);\n  --mtx-caption-font-l: 16px/1.6 var(--mtx-font-family-default);\n}\n\n\n/* ============================================================\n   10bis. SEMANTIC COLORS — couleurs d'usage (brand + feedback)\n   ─────────────────────────────────────────────────────────────\n   Alias sémantiques pointant sur les primitives. À consommer\n   dans les composants plutôt que les paliers bruts.\n   ============================================================ */\n:root {\n  /* Info — Bleu */\n  --mtx-color-info:         var(--mtx-bleu-500);\n  --mtx-color-info-default:  var(--mtx-color-info);\n  --mtx-color-info-dark:    var(--mtx-bleu-600);\n  --mtx-color-info-light:   var(--mtx-bleu-50);\n\n  /* Success — Vert */\n  --mtx-color-success:      var(--mtx-vert-500);\n  --mtx-color-success-default: var(--mtx-color-success);\n  --mtx-color-success-dark: var(--mtx-vert-600);\n  --mtx-color-success-light: var(--mtx-vert-50);\n\n  /* Error — Rouge */\n  --mtx-color-error:        var(--mtx-rouge-500);\n  --mtx-color-error-default: var(--mtx-color-error);\n  --mtx-color-error-dark:   var(--mtx-rouge-600);\n  --mtx-color-error-light:  var(--mtx-rouge-50);\n\n  /* Warning — Jaune */\n  --mtx-color-warning:      var(--mtx-jaune-500);\n  --mtx-color-warning-default: var(--mtx-color-warning);\n  --mtx-color-warning-dark: var(--mtx-jaune-800);\n  --mtx-color-warning-light: var(--mtx-jaune-50);\n}\n\n\n/* ============================================================\n   11.  BRAND ALIASES (par marque active)\n   ============================================================ */\n\n/* Défaut = Placement (Moka primary) — marron INTERDIT */\n:root,\n[data-brand=\"placement\"] {\n  /* Couleurs de marque sémantiques — Placement = Moka */\n  --mtx-color-brand:        var(--mtx-moka-500);\n  --mtx-color-brand-default: var(--mtx-color-brand);\n  --mtx-color-brand-dark:   var(--mtx-moka-600);\n  --mtx-color-brand-darker: var(--mtx-moka-700);\n  --mtx-color-brand-light:  var(--mtx-moka-50);\n\n  --mtx-brand-primary:        var(--mtx-color-brand);\n  --mtx-brand-primary-hover:  var(--mtx-color-brand-dark);\n  --mtx-brand-primary-active: var(--mtx-color-brand-darker);\n  --mtx-brand-primary-ink:    #FFFFFF;\n  --mtx-brand-primary-soft:   var(--mtx-moka-100);\n  --mtx-brand-primary-subtle: var(--mtx-color-brand-light);\n  --mtx-brand-secondary:      var(--mtx-moka-600);\n  --mtx-color-brand-alt:       var(--mtx-terracotta-500);\n  --mtx-color-brand-alt-default: var(--mtx-color-brand-alt);\n  --mtx-color-brand-alt-light: var(--mtx-terracotta-50);\n  --mtx-brand-link-visited:   var(--mtx-moka-700);\n\n  /* Surfaces brand-tied — Moka + Terracotta uniquement */\n  --mtx-brand-surface:          var(--mtx-moka-50);       /* cream signature */\n  --mtx-brand-surface-alt:      var(--mtx-terracotta-50); /* accent chaud */\n  --mtx-brand-accent-soft:      var(--mtx-moka-100);      /* badges, chips */\n  --mtx-brand-secondary-soft:   var(--mtx-terracotta-100);\n  --mtx-brand-surface-inverse:  var(--mtx-moka-900);      /* hero sombre */\n\n  --mtx-brand-shadow:           var(--mtx-shadow-l);\n}\n\n/* Meilleurtaux — Terracotta primary — moka INTERDIT */\n[data-brand=\"meilleurtaux\"] {\n  /* Couleurs de marque sémantiques — Meilleurtaux = Terracotta */\n  --mtx-color-brand:        var(--mtx-terracotta-500);\n  --mtx-color-brand-default: var(--mtx-color-brand);\n  --mtx-color-brand-dark:   var(--mtx-terracotta-600);\n  --mtx-color-brand-darker: var(--mtx-terracotta-700);\n  --mtx-color-brand-light:  var(--mtx-terracotta-50);\n\n  --mtx-brand-primary:        var(--mtx-color-brand);\n  --mtx-brand-primary-hover:  var(--mtx-color-brand-dark);\n  --mtx-brand-primary-active: var(--mtx-color-brand-darker);\n  --mtx-brand-primary-ink:    #FFFFFF;\n  --mtx-brand-primary-soft:   var(--mtx-terracotta-100);\n  --mtx-brand-primary-subtle: var(--mtx-color-brand-light);\n  --mtx-brand-secondary:      var(--mtx-marron-500);\n  --mtx-color-brand-alt:       var(--mtx-marron-500);\n  --mtx-color-brand-alt-default: var(--mtx-color-brand-alt);\n  --mtx-color-brand-alt-light: var(--mtx-marron-50);\n  --mtx-brand-link-visited:   var(--mtx-marron-600);\n\n  /* Surfaces brand-tied — Marron + Terracotta uniquement */\n  --mtx-brand-surface:          var(--mtx-marron-50);     /* cream chaud */\n  --mtx-brand-surface-alt:      var(--mtx-terracotta-50); /* accent chaud */\n  --mtx-brand-accent-soft:      var(--mtx-marron-100);    /* badges, chips */\n  --mtx-brand-secondary-soft:   var(--mtx-terracotta-100);\n  --mtx-brand-surface-inverse:  var(--mtx-marron-900);    /* hero sombre */\n\n  --mtx-brand-shadow:           var(--mtx-shadow-l);\n}\n\n\n/* ============================================================\n   12.  SEMANTIC TOKENS\n   ─────────────────────────────────────────────────────────────\n   Couche d'abstraction qui décrit l'USAGE, pas la couleur.\n   À utiliser dans les composants — jamais les primitives directement.\n\n   Règles (charte graphique MTX) :\n     • SURFACES        : paliers 50 + Blanc.\n                         Exception petites surfaces : Moka-100 / Marron-100.\n     • TEXTE défaut    : Neutral-900.  Plus clair = Neutral-700.\n                         Sur feedback (info/success/warning/error) = palier 600.\n                         Sur surface 50 neutre/marque : reste Neutral-900.\n     • ICONS / ASSETS  : palier 500 (couleur) OU Neutral-900 (neutre).\n   ============================================================ */\n:root {\n\n  /* ─── Surface ─────────────────────────────────────────────── */\n  --mtx-surface-color-light:      var(--mtx-blanc);     /* page principale, cartes */\n  --mtx-surface-color-medium:       var(--mtx-gris-50);   /* zones secondaires, hover gris */\n  --mtx-surface-color-brand:        var(--mtx-color-brand);            /* fond marque plein — Moka-500 / Terracotta-500 */\n  --mtx-surface-color-brand-dark:   var(--mtx-color-brand-dark);       /* fond marque foncé — Moka-600 / Terracotta-600 */\n  --mtx-surface-color-brand-darker: var(--mtx-color-brand-darker);     /* fond marque très foncé — Moka-700 / Terracotta-700 */\n  --mtx-surface-color-brand-light:  var(--mtx-color-brand-light);      /* fond marque clair — Moka-50 / Terracotta-50 */\n  --mtx-surface-color-brand-alt:    var(--mtx-color-brand-alt);        /* fond marque alt plein — Terracotta-500 / Marron-500 */\n  --mtx-surface-color-brand-alt-light: var(--mtx-color-brand-alt-light); /* fond marque alt clair — Terracotta-50 / Marron-50 */\n  --mtx-surface-color-info:         var(--mtx-color-info-light);      /* bandeaux info */\n  --mtx-surface-color-success:      var(--mtx-color-success-light);   /* bandeaux success */\n  --mtx-surface-color-warning:      var(--mtx-color-warning-light);   /* bandeaux warning */\n  --mtx-surface-color-error:        var(--mtx-color-error-light);     /* bandeaux error */\n\n  /* Petites surfaces uniquement (badges, tags, chips). */\n  --mtx-surface-color-accent-soft:     var(--mtx-brand-accent-soft);\n  --mtx-surface-color-secondary-soft:  var(--mtx-brand-secondary-soft);\n\n  /* Surfaces sombres (héros, pieds de page, contraste). */\n  --mtx-surface-color-inverse:      var(--mtx-brand-surface-inverse);\n  --mtx-surface-color-inverse-alt:  var(--mtx-gris-900);\n  --mtx-surface-color-dark:   var(--mtx-noir);      /* surface sombre pleine (= Noir) */\n\n  /* ─── Text ────────────────────────────────────────────────── */\n  --mtx-text-color-primary:         var(--mtx-noir);  /* corps, titres */\n  --mtx-text-color-secondary:           var(--mtx-gris-700);  /* secondaire, captions */\n  --mtx-text-color-tertiary:        var(--mtx-gris-500);\n  --mtx-text-color-brand:           var(--mtx-color-brand);   /* texte de marque */\n  --mtx-text-color-brand-alt:       var(--mtx-color-brand-alt-default);   /* texte de marque alt */\n  --mtx-text-color-brand-light:     var(--mtx-terracotta-100);   /* texte de marque clair */\n  --mtx-text-color-brand-on-surface: var(--mtx-color-brand-dark);  /* texte marque renforcé sur surface */\n  --mtx-text-color-invert:      var(--mtx-blanc);     /* sur surface sombre */\n  --mtx-text-color-light:       var(--mtx-blanc);     /* texte clair */\n  --mtx-text-color-medium:      var(--mtx-gris-50);   /* texte clair atténué sur sombre */\n  --mtx-text-color-on-brand:        var(--mtx-blanc);         /* sur CTA */\n\n  /* Lien — 7 états, suit la marque active (Moka / Terracotta) */\n  --mtx-text-link-color-default:       var(--mtx-color-brand);          /* Moka-500 / Terracotta-500 */\n  --mtx-text-link-color-hover:         var(--mtx-color-brand-dark);     /* Moka-600 / Terracotta-600 */\n  --mtx-text-link-color-visited:       var(--mtx-color-brand-darker);   /* Moka-700 / Terracotta-700 */\n  --mtx-text-link-color-active:        var(--mtx-color-brand-darker);   /* Moka-700 / Terracotta-700 */\n  --mtx-text-link-color-disabled:      var(--mtx-gris-400);\n  --mtx-text-link-color-focus-visible: var(--mtx-color-brand-dark);    /* Moka-600 / Terracotta-600 */\n\n  /* Texte feedback sur leur surface-50 dédiée */\n  --mtx-text-color-info:            var(--mtx-color-info);\n  --mtx-text-color-success:         var(--mtx-color-success);\n  --mtx-text-color-warning:         var(--mtx-color-warning-dark);  /* Jaune-800 pour lisibilité sur jaune */\n  --mtx-text-color-error:           var(--mtx-color-error);\n\n  /* Texte feedback renforcé (palier -dark) pour meilleur contraste sur surface */\n  --mtx-text-color-info-on-surface:    var(--mtx-color-info-dark);\n  --mtx-text-color-success-on-surface: var(--mtx-color-success-dark);\n  --mtx-text-color-warning-on-surface: var(--mtx-jaune-900);\n  --mtx-text-color-error-on-surface:   var(--mtx-color-error-dark);\n\n  /* ─── Icon / Asset ────────────────────────────────────────── */\n  --mtx-icon-color-dark:         var(--mtx-noir);  /* picto neutre */\n  --mtx-icon-color-medium:           var(--mtx-gris-700);\n  --mtx-icon-color-light:         var(--mtx-blanc);\n  --mtx-icon-color-light-medium:  var(--mtx-gris-100);\n  --mtx-icon-color-brand:           var(--mtx-color-brand);\n  --mtx-icon-color-brand-alt:       var(--mtx-color-brand-alt-default);\n  --mtx-icon-color-brand-light:     var(--mtx-terracotta-100);\n  --mtx-icon-color-brand-dark:      var(--mtx-color-brand-dark);\n  --mtx-icon-color-info:            var(--mtx-color-info);\n  --mtx-icon-color-success:         var(--mtx-color-success);\n  --mtx-icon-color-warning:         var(--mtx-color-warning);\n  --mtx-icon-color-error:           var(--mtx-color-error);\n\n  /* Icônes feedback renforcées (palier -dark) pour meilleur contraste sur surface */\n  --mtx-icon-color-info-on-surface:    var(--mtx-color-info-dark);\n  --mtx-icon-color-success-on-surface: var(--mtx-color-success-dark);\n  --mtx-icon-color-warning-on-surface: var(--mtx-jaune-900);\n  --mtx-icon-color-error-on-surface:   var(--mtx-color-error-dark);\n\n  /* ─── Border / Divider ────────────────────────────────────── */\n  --mtx-border-color-light:        var(--mtx-gris-200);  /* dividers discrets */\n  --mtx-border-color-medium:       var(--mtx-gris-400);  /* cards, inputs */\n  --mtx-border-color-dark:        var(--mtx-gris-600);\n  --mtx-border-color-darker:  var(--mtx-noir);  /* séparateurs appuyés */\n  --mtx-border-color-blanc:   var(--mtx-blanc);  /* bordure sur fond sombre */\n  --mtx-border-color-brand:        var(--mtx-color-brand);\n  --mtx-border-color-brand-alt:    var(--mtx-color-brand-alt-default);\n  --mtx-border-color-brand-dark:   var(--mtx-color-brand-dark);\n  --mtx-border-color-brand-darker: var(--mtx-color-brand-darker);\n  --mtx-border-color-focus:         var(--mtx-color-brand);\n  --mtx-border-color-info:          var(--mtx-color-info);\n  --mtx-border-color-success:       var(--mtx-color-success);\n  --mtx-border-color-warning:       var(--mtx-color-warning);\n  --mtx-border-color-error:         var(--mtx-color-error);\n\n  /* ─── Action / Interactive ────────────────────────────────── */\n  --mtx-action-primary:         var(--mtx-surface-color-brand);\n  --mtx-action-primary-hover:   var(--mtx-surface-color-brand-dark);\n  --mtx-action-primary-active:  var(--mtx-surface-color-brand-darker);\n  --mtx-action-primary-ink:     #FFFFFF;\n  --mtx-action-primary-disabled:     var(--mtx-gris-400);   /* état désactivé — bouton primaire */\n  --mtx-action-primary-disabled-ink: #FFFFFF;\n\n  --mtx-action-secondary:          var(--mtx-border-color-brand);         /* bouton contour — bordure/texte de marque */\n  --mtx-action-secondary-hover:    var(--mtx-border-color-brand-dark);\n  --mtx-action-secondary-active:   var(--mtx-border-color-brand-darker);\n  --mtx-action-secondary-disabled: var(--mtx-border-color-medium);\n\n  --mtx-action-outlined:          var(--mtx-border-color-blanc);         /* bouton contour sur surface sombre */\n  --mtx-action-outlined-hover:    var(--mtx-surface-color-light);\n  --mtx-action-outlined-active:   var(--mtx-gris-600);\n  --mtx-action-outlined-disabled: var(--mtx-gris-400);\n\n  --mtx-action-glass:          rgba(255, 255, 255, 0.30);   /* bouton verre — surface photo/sombre */\n  --mtx-action-glass-hover:    var(--mtx-gris-100);\n  --mtx-action-glass-active:   var(--mtx-gris-600);\n  --mtx-action-glass-disabled: var(--mtx-gris-400);\n\n  --mtx-action-tertiary:          var(--mtx-surface-color-brand-light);   /* bouton discret — fond marque clair */\n  --mtx-action-tertiary-hover:    var(--mtx-surface-color-brand);\n  --mtx-action-tertiary-active:   var(--mtx-surface-color-brand-darker);\n  --mtx-action-tertiary-disabled: var(--mtx-gris-400);\n\n  --mtx-action-invert:          var(--mtx-surface-color-light);          /* bouton sur surface sombre */\n  --mtx-action-invert-hover:    var(--mtx-surface-color-brand);\n  --mtx-action-invert-active:   var(--mtx-surface-color-brand-darker);\n  --mtx-action-invert-disabled: var(--mtx-gris-400);\n\n  --mtx-action-danger:          var(--mtx-color-error);\n  --mtx-action-danger-hover:    var(--mtx-color-error-dark);\n  --mtx-action-danger-ink:      #FFFFFF;\n}\n\n/* ============================================================\n   13. ALIAS — RÉTROCOMPATIBLES (legacy names)\n   On garde les noms historiques utilisés dans le guide.\n   ============================================================ */\n:root {\n  /* Texte */\n  --mtx-ink:         var(--mtx-gris-900);\n  --mtx-ink-strong:  #202020;\n  --mtx-ink-soft:    var(--mtx-gris-700);\n  --mtx-ink-muted:   var(--mtx-gris-600);\n\n  /* Lignes & surfaces */\n  --mtx-line:        var(--mtx-gris-200);\n  --mtx-line-soft:   #E5E5E5;\n  --mtx-paper:       var(--mtx-blanc);\n  --mtx-black:       #000000;\n  --mtx-deep:        var(--mtx-moka-900);\n\n  /* Cream (= Moka-50) */\n  --mtx-cream:       var(--mtx-moka-50);\n  --mtx-cream-90:    rgba(249,246,241,0.9);\n  --mtx-cream-warm:  var(--mtx-terracotta-100);\n\n  /* Bases de marque */\n  --mtx-moka:        var(--mtx-moka-500);\n  --mtx-moka-soft:   rgba(119,96,75,0.5);\n  --mtx-moka-haze:   rgba(145,125,103,0.6);\n  --mtx-terracotta:  var(--mtx-terracotta-500);\n  --mtx-marron:      var(--mtx-moka-600);\n  --mtx-marron-deep: #472A2D;\n  --mtx-sand:        var(--mtx-moka-200);\n  --mtx-sand-soft:   var(--mtx-moka-300);\n\n  /* Feedback */\n  --mtx-success:     var(--mtx-color-success);\n  --mtx-warning:     var(--mtx-color-warning);\n  --mtx-danger:      #F84141;\n  --mtx-info:        var(--mtx-color-info);\n\n  /* Ombres legacy */\n  --mtx-shadow-12:   var(--mtx-shadow-s);\n  --mtx-shadow-20:   var(--mtx-shadow-l);\n\n  /* Radius legacy */\n  --mtx-r-xs:   var(--mtx-radius-xs);\n  --mtx-r-sm:   var(--mtx-radius-s);\n  --mtx-r-md:   var(--mtx-radius-l);\n  --mtx-r-lg:   var(--mtx-radius-xl);\n  --mtx-r-pill: var(--mtx-radius-full);\n\n  /* Spacing legacy (s-1 = 4px, doublé...) */\n  --mtx-s-1:  var(--mtx-space-4);\n  --mtx-s-2:  var(--mtx-space-8);\n  --mtx-s-3:  var(--mtx-space-12);\n  --mtx-s-4:  var(--mtx-space-16);\n  --mtx-s-5:  var(--mtx-space-20);\n  --mtx-s-6:  var(--mtx-space-24);\n  --mtx-s-8:  var(--mtx-space-32);\n  --mtx-s-9:  36px;\n  --mtx-s-10: var(--mtx-space-40);\n  --mtx-s-12: var(--mtx-space-48);\n  --mtx-s-16: var(--mtx-space-64);\n  --mtx-s-22: 90px;\n  --mtx-s-32: var(--mtx-space-128);\n}\n\n\n/* ============================================================\n   14. TYPOGRAPHIE — TOKENS COMPOSÉS (shorthand `font:`)\n   ============================================================ */\n:root {\n\n  /* Display + headings — Desktop */\n  --mtx-t-display-1: var(--mtx-font-weight-bold) var(--mtx-font-size-80)/var(--mtx-font-line-height-display) var(--mtx-font-family-default);\n  --mtx-t-display-2: var(--mtx-font-weight-bold) var(--mtx-font-size-60)/var(--mtx-font-line-height-display) var(--mtx-font-family-default);\n  --mtx-t-h1:        var(--mtx-font-weight-bold) var(--mtx-font-size-48)/var(--mtx-font-line-height-heading)  var(--mtx-font-family-default);\n  --mtx-t-h2:        var(--mtx-font-weight-bold) var(--mtx-font-size-40)/var(--mtx-font-line-height-heading)  var(--mtx-font-family-default);\n  --mtx-t-h3:        var(--mtx-font-weight-bold) var(--mtx-font-size-26)/var(--mtx-font-line-height-heading) var(--mtx-font-family-default);\n  --mtx-t-h4:        var(--mtx-font-weight-bold) var(--mtx-font-size-20)/var(--mtx-font-line-height-heading) var(--mtx-font-family-default);\n  --mtx-t-h5:        var(--mtx-font-weight-bold) var(--mtx-font-size-18)/var(--mtx-font-line-height-heading) var(--mtx-font-family-default);\n  --mtx-t-h6:        var(--mtx-font-weight-bold) var(--mtx-font-size-16)/var(--mtx-font-line-height-heading) var(--mtx-font-family-default);\n\n  /* Body */\n  --mtx-t-body-lg:   var(--mtx-font-weight-regular) var(--mtx-font-size-20)/var(--mtx-font-line-height-body) var(--mtx-font-family-default);\n  --mtx-t-body:      var(--mtx-font-weight-regular) var(--mtx-font-size-16)/var(--mtx-font-line-height-body) var(--mtx-font-family-default);\n  --mtx-t-body-sm:   var(--mtx-font-weight-regular) var(--mtx-font-size-14)/var(--mtx-font-line-height-body) var(--mtx-font-family-default);\n  --mtx-t-caption:   var(--mtx-font-weight-regular) var(--mtx-font-size-12)/var(--mtx-font-line-height-body) var(--mtx-font-family-default);\n\n  /* Labels & boutons */\n  --mtx-t-label:     var(--mtx-font-weight-bold) var(--mtx-font-size-14)/var(--mtx-font-line-height-body) var(--mtx-font-family-default);\n  --mtx-t-button:    var(--mtx-font-weight-bold) var(--mtx-font-size-18)/var(--mtx-font-line-height-body) var(--mtx-font-family-default);\n  --mtx-t-button-sm: var(--mtx-font-weight-bold) var(--mtx-font-size-16)/var(--mtx-font-line-height-body) var(--mtx-font-family-default);\n\n  /* Mobile down-steps */\n  --mtx-t-display-mb: var(--mtx-font-weight-bold) var(--mtx-font-size-40)/var(--mtx-font-line-height-display) var(--mtx-font-family-default);\n  --mtx-t-h3-mb:      var(--mtx-font-weight-bold) var(--mtx-font-size-22)/var(--mtx-font-line-height-heading) var(--mtx-font-family-default);\n}\n\n\n/* ============================================================\n   15. DEFAULTS\n   ============================================================ */\nhtml, body { background: var(--mtx-paper); color: var(--mtx-ink); }\nbody { font: var(--mtx-t-body); -webkit-font-smoothing: antialiased; }\n\nh1 { font: var(--mtx-t-h1); color: var(--mtx-ink); margin: 0; letter-spacing: var(--mtx-ls-tight); }\nh2 { font: var(--mtx-t-h2); color: var(--mtx-ink); margin: 0; letter-spacing: var(--mtx-ls-snug); }\nh3 { font: var(--mtx-t-h3); color: var(--mtx-ink); margin: 0; }\nh4 { font: var(--mtx-t-h4); color: var(--mtx-ink); margin: 0; }\nh5 { font: var(--mtx-t-h5); color: var(--mtx-ink); margin: 0; }\nh6 { font: var(--mtx-t-h6); color: var(--mtx-ink); margin: 0; }\np  { margin: 0; }\nsmall { font: var(--mtx-t-caption); color: var(--mtx-ink-soft); }\na  { color: var(--mtx-brand-primary); text-decoration: underline; text-underline-offset: 2px; }\na:hover { opacity: 0.85; }\n\n/* Demi-cercle signature */\n.demicercle {\n  --mtx-d: 24px;\n  display: inline-block;\n  width: calc(var(--mtx-d) / 2);\n  height: var(--mtx-d);\n  background: var(--mtx-brand-primary);\n  border-radius: 0 calc(var(--mtx-d) / 2) calc(var(--mtx-d) / 2) 0;\n  flex-shrink: 0;\n}\n\n/* ============================================================\n   BASE — reset minimal + styles élémentaires\n   Consomme uniquement des tokens sémantiques (--mtx-*).\n   ============================================================ */\n\n*,\n*::before,\n*::after { box-sizing: border-box; }\n\nhtml,\nbody { margin: 0; padding: 0; }\n\nbody {\n  min-height: 100vh;\n  font: var(--mtx-body-font-16-regular);\n  color: var(--mtx-text-color-primary);\n  background: var(--mtx-surface-color-brand-alt-light);\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, h2, h3, h4, h5, h6, p, figure { margin: 0; }\nul, ol { margin: 0; padding: 0; list-style: none; }\nimg, svg { display: block; max-width: 100%; }\n\nbutton, input, select, textarea {\n  font-family: var(--mtx-font-family-default);\n  color: inherit;\n}\nbutton { cursor: pointer; }\nbutton[disabled] { cursor: not-allowed; }\n\ninput::placeholder { color: var(--mtx-text-color-tertiary); }\n\n/* Autofill : conserver la surface blanche des champs */\ninput:-webkit-autofill,\ninput:-webkit-autofill:hover,\ninput:-webkit-autofill:focus,\nselect:-webkit-autofill,\ntextarea:-webkit-autofill {\n  -webkit-box-shadow: 0 0 0 1000px var(--mtx-surface-color-light) inset;\n  box-shadow: 0 0 0 1000px var(--mtx-surface-color-light) inset;\n  -webkit-text-fill-color: var(--mtx-text-color-primary);\n  caret-color: var(--mtx-text-color-primary);\n  transition: background-color 9999s ease-out 0s;\n}\n\na {\n  color: var(--mtx-text-link-color-default);\n  text-decoration: underline;\n  text-underline-offset: 2px;\n}\n@media (hover: hover) and (pointer: fine) {\n  a:hover { color: var(--mtx-text-link-color-hover); }\n}\na:visited { color: var(--mtx-text-link-color-visited); }\na:active { color: var(--mtx-text-link-color-active); }\n\n/* Focus clavier visible sur tous les éléments interactifs */\n:where(a, button, input, select, textarea, [tabindex]):focus-visible {\n  outline: var(--mtx-border-width-m) solid var(--mtx-border-color-focus);\n  outline-offset: 2px;\n}\n\n/* Utilitaire d'accessibilité — le seul autorisé */\n.u-visually-hidden {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  margin: -1px;\n  padding: 0;\n  overflow: hidden;\n  clip: rect(0 0 0 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n[hidden] { display: none !important; }\n\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n  *::after {\n    animation-duration: 0.001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.001ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n\n/* ============================================================\n   LAYOUT — gabarits, conteneurs, grille du parcours\n   Grille DS : container desktop 1260px, marge min 90px,\n   breakpoints 768px (tablette) et 1090px (desktop).\n   ============================================================ */\n\n:root {\n  /* Gouttières horizontales du gabarit — de mobile à desktop */\n  --l-gutter: var(--mtx-grid-margin-mobile);\n  --l-shell-max: var(--mtx-design-desktop);\n}\n\n@media (min-width: 768px) {\n  :root { --l-gutter: var(--mtx-space-32); }\n}\n@media (min-width: 1090px) {\n  :root { --l-gutter: 90px; }\n}\n\n.l-app {\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n  background: var(--mtx-surface-color-light);\n}\n\n/* En-tête ---------------------------------------------------- */\n.l-header {\n  flex: 0 0 auto;\n  width: 100%;\n  max-width: var(--l-shell-max);\n  margin-inline: auto;\n  padding: var(--mtx-space-8) var(--l-gutter);\n  min-height: 60px;\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-12);\n  background: var(--mtx-surface-color-light);\n}\n.l-header--desktop {\n  min-height: 80px;\n  padding-block: var(--mtx-space-8);\n  justify-content: space-between;\n  gap: var(--mtx-space-24);\n  border-bottom: var(--mtx-border-width-s) solid var(--mtx-surface-color-brand-alt-light);\n}\n@media (max-width: 1089px) {\n  .l-header--desktop { display: none; }\n}\n@media (min-width: 1090px) {\n  .l-header:not(.l-header--desktop) { display: none; }\n}\n/* Filet de séparation sous l'en-tête mobile (maquettes mobiles) */\n@media (max-width: 1089px) {\n  .l-header:not(.l-header--desktop) {\n    border-bottom: var(--mtx-border-width-s) solid var(--mtx-surface-color-brand-alt-light);\n  }\n}\n.l-header__logo { height: 39px; width: auto; }\n.l-header__logo--symbol { height: 30px; width: auto; }\n/* Logo centré sur la largeur de l'écran, quelle que soit la largeur\n   du bouton retour et de la note Trustpilot de part et d'autre. */\n.l-header__center {\n  position: absolute;\n  left: 50%;\n  transform: translateX(-50%);\n  display: flex;\n  justify-content: center;\n  pointer-events: none;\n}\n.l-header:not(.l-header--desktop) { position: relative; }\n.l-header:not(.l-header--desktop) > .mtx-trust__stars { margin-left: auto; }\n\n/* Corps ------------------------------------------------------ */\n.l-body {\n  flex: 1 1 auto;\n  display: flex;\n  justify-content: center;\n  background: var(--mtx-surface-color-brand-alt-light);\n}\n.l-shell {\n  width: 100%;\n  max-width: var(--l-shell-max);\n  padding: var(--mtx-space-20) var(--l-gutter);\n}\n@media (min-width: 1090px) {\n  .l-shell { padding-block: var(--mtx-space-40); }\n}\n\n/* Gabarit du parcours : rail d'étapes + colonne de contenu --- */\n.l-funnel {\n  display: flex;\n  flex-direction: row;\n  align-items: flex-start;\n  gap: 36px; /* gouttière desktop DS */\n}\n.l-funnel__main {\n  flex: 1 1 auto;\n  min-width: 0;\n  max-width: 828px;\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-20);\n}\n@media (max-width: 1089px) {\n  .l-funnel { gap: 0; }\n  .l-funnel__main { max-width: none; gap: var(--mtx-space-12); }\n}\n\n/* Grille libellé / contrôle (formulaires du parcours) -------- */\n.l-form-grid {\n  display: grid;\n  width: 100%;\n  row-gap: var(--mtx-space-20);\n  column-gap: var(--mtx-space-24);\n  grid-template-columns: minmax(0, 1fr);\n}\n/* Mobile : 8px entre un libellé et son champ, 24px entre deux groupes\n   (20px au total entre un champ et le libellé du dessous). */\n@media (max-width: 1089px) {\n  .l-form-grid { row-gap: var(--mtx-space-8); }\n  .l-form-grid > .mtx-field + .mtx-field__label-block {\n    margin-top: var(--mtx-space-12);\n  }\n}\n@media (min-width: 1090px) {\n  .l-form-grid {\n    grid-template-columns: max-content minmax(0, var(--l-control-width, 420px));\n    align-items: start;\n    justify-content: center;\n  }\n  /* Le libellé s'aligne sur la hauteur du champ (40px), pas sur la\n     cellule entière : un message d'erreur sous le champ ne le décale plus. */\n  .l-form-grid > .mtx-field__label-block {\n    min-height: 40px;\n    justify-content: center;\n  }\n  .l-form-grid--wide { --l-control-width: 500px; }\n  .l-form-grid--auto { grid-template-columns: max-content minmax(0, max-content); }\n  .l-form-grid--split { grid-template-columns: minmax(0, 1fr) minmax(0, 380px); }\n  .l-form-grid--split .mtx-field__label-block { align-items: flex-end; text-align: right; }\n  .l-form-grid--start {\n    grid-template-columns: max-content 200px;\n    justify-content: start;\n  }\n}\n\n\n/* ============================================================\n   COMPOSANT — Bouton\n   Variantes : primary · secondary · tertiary · link · icon\n   Tailles    : s (27) · m (40) · l (48) · xl (56)\n   États      : default · hover · active · disabled\n   ============================================================ */\n\n.mtx-button {\n  --mtx-button-height: 48px;\n  height: var(--mtx-button-height);\n  flex: 0 0 auto;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--mtx-space-8);\n  padding-inline: var(--mtx-space-28);\n  border: var(--mtx-border-width-s) solid transparent;\n  border-radius: var(--mtx-radius-full);\n  font: var(--mtx-font-weight-bold) var(--mtx-button-font-l);\n  white-space: nowrap;\n  transition: var(--mtx-transition-color);\n}\n.mtx-button:active:not([disabled]) { transform: scale(0.98); }\n\n.mtx-button--s  { --mtx-button-height: 27px; padding-inline: var(--mtx-space-16); font: var(--mtx-font-weight-bold) var(--mtx-button-font-s); }\n.mtx-button--m  { --mtx-button-height: 40px; font: var(--mtx-font-weight-bold) var(--mtx-button-font-m); }\n.mtx-button--l  { --mtx-button-height: 48px; }\n.mtx-button--xl { --mtx-button-height: 56px; font: var(--mtx-font-weight-bold) var(--mtx-button-font-xl); }\n\n/* Plein */\n.mtx-button--primary {\n  background: var(--mtx-action-primary);\n  color: var(--mtx-action-primary-ink);\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-button--primary:hover:not([disabled]) { background: var(--mtx-action-primary-hover); }\n}\n.mtx-button--primary:active:not([disabled]) { background: var(--mtx-action-primary-active); }\n.mtx-button--primary[disabled],\n.mtx-button--primary[aria-disabled=\"true\"] { background: var(--mtx-action-primary-disabled); color: var(--mtx-action-primary-disabled-ink); }\n@media (hover: hover) and (pointer: fine) {\n  .mtx-button--primary[aria-disabled=\"true\"]:hover { background: var(--mtx-action-primary-disabled); }\n}\n\n/* La flèche avance légèrement au survol du CTA principal */\n.mtx-button--primary [data-icon=\"arrow-right\"] {\n  display: inline-flex;\n  transition: transform var(--mtx-duration-default) var(--mtx-ease-out);\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-button--primary:hover:not([disabled]) [data-icon=\"arrow-right\"] {\n    transform: translateX(var(--mtx-space-4));\n  }\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-button--primary[aria-disabled=\"true\"]:hover [data-icon=\"arrow-right\"] { transform: none; }\n}\n\n/* Contour */\n.mtx-button--secondary {\n  background: transparent;\n  border-color: var(--mtx-action-secondary);\n  color: var(--mtx-action-secondary);\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-button--secondary:hover:not([disabled]) {\n    background: var(--mtx-action-secondary);\n    color: var(--mtx-text-color-on-brand);\n  }\n}\n.mtx-button--secondary[disabled] {\n  border-color: var(--mtx-action-secondary-disabled);\n  color: var(--mtx-text-color-tertiary);\n}\n\n/* Discret — fond marque clair */\n.mtx-button--tertiary {\n  background: var(--mtx-action-tertiary);\n  color: var(--mtx-text-color-brand);\n  font: var(--mtx-font-weight-bold) var(--mtx-button-font-m);\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-button--tertiary:hover:not([disabled]) {\n    background: var(--mtx-action-tertiary-hover);\n    color: var(--mtx-text-color-on-brand);\n  }\n}\n\n/* Lien souligné */\n.mtx-button--link {\n  height: auto;\n  padding: 0;\n  border: 0;\n  background: none;\n  color: var(--mtx-text-link-color-default);\n  font: var(--mtx-body-font-14-bold);\n  text-decoration: underline;\n  text-underline-offset: 2px;\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-button--link:hover { color: var(--mtx-text-link-color-hover); }\n}\n.mtx-button--link:active:not([disabled]) { transform: none; }\n\n/* Icône seule — carré ou pastille */\n.mtx-button--icon {\n  width: var(--mtx-button-height);\n  padding: 0;\n}\n.mtx-button--plain {\n  width: var(--mtx-icon-size-l);\n  height: var(--mtx-icon-size-l);\n  padding: 0;\n  border: 0;\n  border-radius: var(--mtx-radius-full);\n  background: none;\n  color: var(--mtx-icon-color-dark);\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-button--plain:hover { opacity: var(--mtx-opacity-strong); }\n}\n\n/* Pastille ronde de comptage (±) */\n.mtx-button--round {\n  width: 34px;\n  height: 34px;\n  padding: 0;\n  border-radius: var(--mtx-radius-full);\n  border-color: var(--mtx-action-secondary);\n  background: transparent;\n  color: var(--mtx-text-color-brand);\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-button--round:hover:not([disabled]) { background: var(--mtx-surface-color-brand-light); }\n}\n.mtx-button--round[disabled] {\n  border-color: var(--mtx-border-color-light);\n  background: var(--mtx-surface-color-medium);\n  color: var(--mtx-text-color-tertiary);\n}\n\n/* ============================================================\n   COMPOSANT — Chip de sélection (radio visuel compact)\n   États : default · hover · selected (aria-pressed / aria-checked)\n   Variante : --multiline (libellés longs)\n   ============================================================ */\n\n.mtx-chip {\n  min-height: 40px;\n  padding: 0 var(--mtx-space-16);\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  border: var(--mtx-border-width-s) solid var(--mtx-border-color-light);\n  border-radius: var(--mtx-radius-s);\n  background: var(--mtx-surface-color-light);\n  color: var(--mtx-text-color-primary);\n  font: var(--mtx-body-font-16-regular);\n  white-space: nowrap;\n  transition: var(--mtx-transition-color);\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-chip:hover {\n    background: var(--mtx-surface-color-brand-light);\n    border-color: var(--mtx-terracotta-300);\n    color: var(--mtx-text-color-brand);\n  }\n}\n.mtx-chip[aria-checked=\"true\"],\n.mtx-chip[aria-pressed=\"true\"] {\n  background: var(--mtx-surface-color-brand-light);\n  border-color: var(--mtx-border-color-brand);\n  color: var(--mtx-text-color-brand);\n}\n.mtx-chip--multiline {\n  height: auto;\n  padding: 7px var(--mtx-space-16);\n  white-space: normal;\n  text-align: center;\n  flex: 0 1 auto;\n}\n\n/* Groupe de chips */\n.mtx-chip-group {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--mtx-space-12);\n  min-width: 0;\n}\n.mtx-chip-group--tight { gap: var(--mtx-space-8); }\n@media (min-width: 1090px) {\n  .mtx-chip-group--nowrap { flex-wrap: nowrap; }\n}\n\n/* ============================================================\n   COMPOSANT — Carte de choix (liste de réponses radio)\n   États : default · hover · selected (aria-checked)\n   ============================================================ */\n\n.mtx-choice-group {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-16);\n}\n\n.mtx-choice {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-12);\n  width: 100%;\n  min-height: 56px;\n  padding: 10px 30px 10px var(--mtx-space-20);\n  border: var(--mtx-border-width-s) solid var(--mtx-terracotta-200);\n  border-radius: var(--mtx-radius-m);\n  background: var(--mtx-surface-color-light);\n  color: var(--mtx-text-color-primary);\n  text-align: left;\n  transition: var(--mtx-transition-color), box-shadow var(--mtx-duration-default) var(--mtx-ease-in-out), transform var(--mtx-duration-default) var(--mtx-ease-in-out);\n}\n@media (hover: hover) and (pointer: fine) {\n  .mtx-choice:hover {\n    background: var(--mtx-surface-color-brand-light);\n    border-color: var(--mtx-terracotta-300);\n    color: var(--mtx-text-color-brand);\n    box-shadow: var(--mtx-shadow-xs);\n    transform: translateY(-1px);\n  }\n}\n.mtx-choice:active { transform: scale(0.98); box-shadow: none; }\n\n.mtx-choice[aria-checked=\"true\"] {\n  background: var(--mtx-surface-color-brand-light);\n  border-color: var(--mtx-border-color-brand);\n  box-shadow: inset 0 0 0 var(--mtx-border-width-s) var(--mtx-border-color-brand);\n  color: var(--mtx-text-color-brand);\n}\n\n.mtx-choice__radio {\n  width: var(--mtx-icon-size-s);\n  height: var(--mtx-icon-size-s);\n  flex: 0 0 auto;\n  border-radius: var(--mtx-radius-full);\n  box-shadow: inset 0 0 0 var(--mtx-border-width-s) var(--mtx-border-color-light);\n  transition: background var(--mtx-duration-default) var(--mtx-ease-in-out);\n}\n.mtx-choice[aria-checked=\"true\"] .mtx-choice__radio {\n  background: radial-gradient(circle,\n    var(--mtx-color-brand) 0 4px,\n    var(--mtx-surface-color-brand-light) 4px 6.5px,\n    var(--mtx-color-brand) 6.5px 8px);\n  box-shadow: none;\n}\n\n.mtx-choice__label { font: var(--mtx-body-font-18-semibold); color: inherit; }\n.mtx-choice__sub { font: var(--mtx-body-font-18-regular); color: inherit; }\n\n/* Mobile : la précision entre parenthèses passe sous le libellé et\n   s'enroule, au lieu d'être tronquée sur la même ligne. */\n@media (max-width: 1089px) {\n  .mtx-choice {\n    flex-wrap: wrap;\n    row-gap: var(--mtx-space-2);\n    padding-inline: var(--mtx-space-20);\n  }\n  .mtx-choice__sub { font: var(--mtx-body-font-16-regular); }\n  /* Le libellé rétrécit et passe à la ligne DANS sa colonne :\n     il reste toujours sur la même ligne que le radio. */\n  .mtx-choice__label { flex: 1 1 0; min-width: 0; }\n  .mtx-choice__sub { flex: 1 1 100%; min-width: 0; }\n}\n\n/* ============================================================\n   COMPOSANT — Champ de formulaire\n   Structure : .mtx-field > .mtx-field__label + .mtx-field__control\n   Contrôles : .mtx-input · .mtx-select · suffixes d'unité\n   États     : default · focus · disabled · error\n   ============================================================ */\n\n.mtx-field {\n  display: flex;\n  flex-direction: column;\n  gap: var(--mtx-space-4);\n}\n\n.mtx-field__label {\n  font: var(--mtx-heading-font-16-bold);\n  color: var(--mtx-text-color-primary);\n}\n.mtx-field__required { color: var(--mtx-text-color-error); }\n.mtx-field__label--inline { line-height: 40px; }\n.mtx-field__note {\n  font: var(--mtx-body-font-14-regular);\n  color: var(--mtx-text-color-secondary);\n  white-space: nowrap;\n}\n.mtx-field__error {\n  display: flex;\n  align-items: flex-start;\n  gap: var(--mtx-space-4);\n  margin-top: var(--mtx-space-4);\n  font: var(--mtx-body-font-14-regular);\n  color: var(--mtx-text-color-error);\n}\n.mtx-field__error svg { flex: 0 0 auto; margin-top: var(--mtx-space-2); }\n.mtx-field__hint {\n  display: flex;\n  align-items: center;\n  gap: var(--mtx-space-4);\n  font: var(--mtx-body-font-14-regular);\n  color: var(--mtx-text-color-primary);\n}\n\n.mtx-field__label-block {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  text-align: left;\n}\n/* Mobile : la note « (facultatif) / (estimés) » reste sur la ligne\n   du libellé plutôt que de passer dessous (maquettes mobiles). */\n@media (max-width: 1089px) {\n  .mtx-field { gap: var(--mtx-space-8); }\n  .mtx-field__label-block--empty { display: none; }\n  .mtx-field__label-block {\n    flex-direction: row;\n    flex-wrap: wrap;\n    align-items: baseline;\n    column-gap: var(--mtx-space-8);\n  }\n}\n\n/* Libellés ferrés à droite sur la grille desktop (maquettes) */\n@media (min-width: 1090px) {\n  .mtx-field__label-block {\n    align-items: flex-end;\n    text-align: right;\n  }\n  .mtx-field__label--nowrap { white-space: nowrap; }\n}\n\n.mtx-field__control {\n  position: relative;\n  width: 100%;\n  min-width: 0;\n}\n\n/* Contrôles -------------------------------------------------- */\n.mtx-input,\n.mtx-select {\n  width: 100%;\n  height: 40px;\n  padding: 0 var(--mtx-space-12);\n  border: var(--mtx-border-width-s) solid var(--mtx-border-color-light);\n  border-radius: var(--mtx-radius-s);\n  background: var(--mtx-surface-color-light);\n  color: var(--mtx-text-color-primary);\n  font: var(--mtx-heading-font-16-regular);\n  outline: none;\n  transition: var(--mtx-transition-color);\n}\n.mtx-input:focus,\n.mtx-select:focus { border-color: var(--mtx-border-color-focus); }\n\n.mtx-input[disabled],\n.mtx-select[disabled] {\n  background: var(--mtx-surface-color-medium);\n  color: var(--mtx-text-color-secondary);\n  cursor: not-allowed;\n}\n.mtx-input[aria-invalid=\"true\"] { border-color: var(--mtx-border-color-error); }\n\n.mtx-select {\n  appearance: none;\n  -webkit-appearance: none;\n  padding-right: var(--mtx-space-32);\n  cursor: pointer;\n}\n\n/* Suffixes / affixes ---------------------------------------- */\n.mtx-field__affix {\n  position: absolute;\n  top: 0;\n  height: 40px;\n  display: flex;\n  align-items: center;\n  color: var(--mtx-text-color-primary);\n  pointer-events: none;\n}\n.mtx-field__affix--end { right: var(--mtx-space-12); }\n.mtx-field__affix--start { left: var(--mtx-space-12); }\n.mtx-field__affix--unit { font: var(--mtx-body-font-16-bold); }\n.mtx-field__affix--currency { font: var(--mtx-body-font-16-regular); }\n.mtx-field__affix--icon { color: var(--mtx-icon-color-dark); }\n\n/* Réserve de place pour l'affixe dans le champ */\n.mtx-input--unit { padding-right: 88px; }\n.mtx-input--currency { padding-right: var(--mtx-space-32); }\n.mtx-input--prefixed { padding-left: 56px; }\n.mtx-select--flag { padding-left: 40px; color: transparent; }\n\n/* Hauteur L (48px) — champs de modale */\n.mtx-input--l { height: 48px; }\n\n/* ------------------------------------------------------------\n   ÉTAT INVALIDE — générique, piloté par les attributs ARIA\n   • sur le contrôle       : aria-invalid=\"true\"\n   • sur le conteneur      : data-invalid=\"true\" (label + message)\n   Le contour rouge n'est jamais le seul signal : le libellé passe\n   en rouge et un message texte est ajouté sous le champ.\n   ------------------------------------------------------------ */\n.mtx-input[aria-invalid=\"true\"],\n.mtx-select[aria-invalid=\"true\"],\n[aria-invalid=\"true\"] > .mtx-input,\n[aria-invalid=\"true\"] > .mtx-select {\n  border-color: var(--mtx-border-color-error);\n  background: var(--mtx-surface-color-error);\n}\n.mtx-input[aria-invalid=\"true\"]:focus,\n.mtx-select[aria-invalid=\"true\"]:focus {\n  border-color: var(--mtx-border-color-error);\n}\n\n.mtx-field[data-invalid=\"true\"] > .mtx-field__label,\n.mtx-field[data-invalid=\"true\"] .mtx-field__label-block .mtx-field__label,\n[data-invalid=\"true\"] > .mtx-field__label {\n  color: var(--mtx-text-color-error);\n}\n\n/* Groupes (chips, cases) : bordure des o
